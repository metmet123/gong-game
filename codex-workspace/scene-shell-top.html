<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#263b32"><title>공무원 키우기 · 사무실의 하루</title><style>__CSS__</style></head><body>
<main class="scene-app">
<header class="game-top"><div class="game-brand"><span class="logomark" aria-hidden="true">▤</span><div><h1>공무원 키우기</h1><small>금일 중 제출</small></div></div><div class="hud-right"><span class="points" id="coin-stat">◈ 30 P</span><button class="hud-action" id="sound-button" aria-label="효과음 끄기"></button><button class="hud-action" id="help-button" aria-label="게임 안내"></button></div></header>
<section class="game-stage" aria-label="사무실 게임 화면"><div class="scene-world" id="scene-world"><canvas id="office" width="1100" height="660" role="img" aria-label="전화와 서류, 결재함이 놓인 사무실"></canvas><button class="objecthit" data-object="phone" aria-label="전화 업무 시작"><span class="object-label">전화 <b>1</b></span></button><button class="objecthit" data-object="papers" aria-label="서류 검토 시작"><span class="object-label">서류 <b>1</b></span></button><button class="objecthit" data-object="inbox" aria-label="결재함 업무 시작"><span class="object-label">결재함 <b>2</b></span></button><button class="objecthit" data-object="computer" aria-label="PC 자동화 시작"><span class="object-label">PC <b>0</b></span></button><button class="objecthit" data-object="chat" aria-label="동료와 이야기"><span class="object-label">선배</span></button><button class="objecthit" data-object="coffee" aria-label="커피 휴식"><span class="object-label">휴식</span></button><button class="objecthit" data-object="door" aria-label="사무실 문으로 퇴근"><span class="object-label">퇴근</span></button></div>
<div class="scene-hud"><div class="daypill"><strong id="day-heading">1일차 · 월요일</strong><small id="office-clock">09:00</small><span class="daysteps" id="week-steps" aria-label="주간 진행"></span></div><div class="daily-status">오늘의 업무<b id="tasks-stat">0 / 4</b></div></div>
<div class="playerplate"><canvas id="talk-avatar" width="32" height="32" aria-hidden="true"></canvas><div><strong id="player-label">새싹 · 시보 주무관</strong><small id="energy-stat">집중력 100</small><div class="xpbar"><span id="xp-fill"></span></div></div></div><p class="scene-tip" id="scene-tip">반짝이는 물건을 눌러요</p><div class="speech" id="scene-speech" role="status" aria-live="polite" hidden></div></section>
<nav class="dock" aria-label="게임 메뉴"><div class="dock-menu"><button class="dock-button" data-view="growth"></button><button class="dock-button" data-view="office"></button><button class="dock-button" data-view="archive"></button><button class="dock-button" data-view="settings"></button></div><button class="dock-end waiting" id="end-day">퇴근까지 4건</button></nav>
</main>
<dialog class="menu-modal" id="menu-modal" aria-labelledby="menu-title"><header class="menu-head"><h2 id="menu-title">메뉴</h2><button id="menu-close" aria-label="메뉴 닫기">×</button></header>
__MENUS__
</dialog>
<dialog class="modal" id="game-modal" aria-labelledby="modal-title"><div class="modalhead"><div><small id="modal-eyebrow">오늘의 업무</small><h2 id="modal-title">업무 시작</h2></div><button class="modalclose" id="modal-close" aria-label="닫고 사무실로 돌아가기">×</button></div><div class="modalbody" id="modal-content"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div><span id="save-status" class="sr-only"></span><script>__JS__</script></body></html>
