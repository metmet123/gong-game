<title id="title">민원봉사과 24×18 배치 계획</title><desc id="desc">직원 책상은 위쪽, 창구는 가운데, 대기실은 아래쪽. 중앙 두 열은 주 통로이며 오른쪽 후면은 기록 구역이다. 물품 번호와 접근점은 map_layout.json에 대응한다.</desc>
