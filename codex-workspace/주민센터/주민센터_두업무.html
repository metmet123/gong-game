</style></head><body><div id="center"><header class="center-header"><button id="return" hidden>← 업무 선택</button><div class="center-brand"><span class="brand-mark" aria-hidden="true">◈</span><div><b>모퉁이동 주민센터</b><small id="subtitle">오늘의 업무를 선택하세요</small></div></div><button id="settings">기록</button></header><main id="hub"></main><section id="desk" hidden aria-label="현재 업무"></section><div id="center-status" role="status" aria-live="polite"></div></div><dialog id="center-dialog" aria-labelledby="center-dialog-title"><header><h2 id="center-dialog-title"></h2><button id="center-dialog-close" aria-label="창 닫기">×</button></header><div id="center-dialog-body"></div><footer id="center-dialog-actions"></footer></dialog><input type="file" id="center-import" accept="application/json,.json" hidden><script>
(function(root){
  'use strict';
  const person=(id,name,detail,palette=0)=>({id,name,detail,palette,adult:true});
  function make(spec){
    const c={contentVersion:1,rulesVersion:1,questions:[],...spec};
    c.visitId=c.visitId||c.id;
    c.addresses=[{id:c.id+'-home',label:c.newAddress,existing:c.existing||[]},{id:c.id+'-other',label:c.wrongAddress,existing:[]}];
    c.expected={moverIds:c.movers,addressId:c.addresses[0].id,mode:c.existing?.length?'join':'new',headId:c.head,relations:c.relations,outcome:c.pending?'followup_requested':'registered'};
    c.before={address:c.oldAddress,headId:c.oldHead,memberIds:c.people.map(p=>p.id),relationByPerson:c.oldRelations,active:true};
    c.documents=[{id:'report',title:'전입신고 내용',subtitle:'누가 · 어디로 · 어떤 세대로',status:'provided',lines:c.report,factIds:['request'],check:false},{id:'identity',title:'제시된 확인 자료',subtitle:'가상 사례의 준비 상태',status:'provided',lines:['이 사례의 신고인과 성인 전입자 확인 자료가 준비되어 있습니다.','아래 버튼으로 자료 카드의 준비 상태를 확인해 주세요. 실제 본인 확인을 수행하는 화면은 아닙니다.'],factIds:['identity'],check:true}];
    c.requiredFacts=['request','identity'];
    if(c.existing?.length){c.documents.push({id:'headcheck',title:'전입지 세대주 확인',subtitle:c.pending?'추가 확인이 필요합니다':'확인 자료가 준비되었습니다',status:c.pending?'missing':'provided',lines:c.pending?['기존 세대주 '+c.existing[0].name+'의 확인 자료는 아직 제시되지 않았습니다.','오늘은 확인이 필요한 항목과 재방문 안내를 남길 수 있습니다.']:['이 사례의 전입지 세대주 '+c.existing[0].name+' 확인 자료가 준비되어 있습니다.'],factIds:['headcheck'],check:true});c.requiredFacts.push('headcheck');}
    if(c.addressQuestion)c.requiredFacts.push('address');
    c.followupReasons=[{id:'headcheck',label:'전입지 세대주 확인 자료 보완',guidance:'기존 세대주 확인이 필요한 내용을 안내하고, 확인 자료가 준비되면 다시 방문해 주세요.'},{id:'address',label:'상세주소 재확인',guidance:'정확한 상세주소를 확인해 주세요.'},{id:'movers',label:'이동자 범위 재확인',guidance:'이번에 실제로 이동하는 사람을 확인해 주세요.'}];
    c.hints=c.hints||['신고 내용에서 이동하는 사람과 남는 사람을 먼저 확인하세요.','관계는 이전 세대주가 아니라 이사 후 세대주를 기준으로 기록합니다.',c.report.join(' ')];
    return c;
  }
  const cases=[
    make({id:'M01',title:'첫 번째 주소',subtitle:'한 사람의 새로운 시작',resident:'sae',people:[person('sae','윤새봄','신고인 · 성인',0)],oldHead:'sae',oldAddress:'들꽃길 3 · 101호',oldRelations:{sae:'본인'},newAddress:'모퉁이로 12 · 201호',wrongAddress:'모퉁이로 12 · 202호',movers:['sae'],head:'sae',relations:{sae:'본인'},speech:'저 혼자 이사했어요. 새 주소는 모퉁이로 12, 201호예요. 새집에도 저 혼자 세대를 만들면 됩니다.',report:['윤새봄 한 사람 모두 이동합니다.','새 주소는 모퉁이로 12 · 201호입니다.','새 세대를 구성하며 세대주는 윤새봄입니다.'],ending:'제 첫 독립 주소네요. 이사 온 게 실감 나요.'}),
    make({id:'M02',title:'함께 옮기는 집',subtitle:'세대 전체 이동',resident:'yu',people:[person('yu','서유진','신고인 · 성인',0),person('min','박민재','유진의 배우자 · 성인',1),person('sol','박해솔','유진의 자녀 · 성인',2)],oldHead:'yu',oldAddress:'나무길 8 · 101호',oldRelations:{yu:'본인',min:'배우자',sol:'자녀'},newAddress:'모퉁이로 12 · 202호',wrongAddress:'모퉁이로 12 · 201호',movers:['yu','min','sol'],head:'yu',relations:{yu:'본인',min:'배우자',sol:'자녀'},speech:'저희 세 사람 모두 이사했어요. 새집은 모퉁이로 12, 202호입니다. 세대주는 그대로 저예요.',report:['서유진·박민재·박해솔 모두 이동합니다.','새 주소는 모퉁이로 12 · 202호, 새 세대를 구성합니다.','세대주는 유진입니다. 민재는 유진의 배우자, 해솔은 성인 자녀입니다.'],ending:'세 사람의 새집 주소가 잘 등록됐네요. 감사합니다.'}),
    make({id:'M03',title:'첫 독립, 둘이 함께',subtitle:'세대 일부 이동',resident:'ga',people:[person('chae','김채림','기존 세대주 · 성인',3),person('ga','이가온','신고인 · 채림의 자녀',0),person('bo','이보람','가온의 동생 · 성인',2)],oldHead:'chae',oldAddress:'나무길 8 · 101호',oldRelations:{chae:'본인',ga:'자녀',bo:'자녀'},newAddress:'모퉁이로 12 · 202호',wrongAddress:'모퉁이로 12 · 201호',movers:['ga','bo'],head:'ga',relations:{ga:'본인',bo:'형제자매'},speech:'저와 동생 보람만 이사했어요. 어머니 채림은 원래 집에 계세요. 새 세대주는 저예요.',report:['이가온과 이보람만 모퉁이로 12 · 202호로 이동합니다.','김채림은 이전 집의 세대주로 남습니다.','새 세대주 이가온을 기준으로 보람은 형제자매입니다.'],ending:'이제 정말 저희 집 주소가 생겼네요. 이삿짐 정리하러 갈게요.'}),
    make({id:'M04',title:'친구의 집으로',subtitle:'기존 세대 편입',resident:'da',people:[person('jun','문준서','기존 세대주 · 성인',1),person('da','문다온','신고인 · 준서의 형제자매',2)],oldHead:'jun',oldAddress:'나무길 8 · 101호',oldRelations:{jun:'본인',da:'형제자매'},newAddress:'햇살길 7 · 301호',wrongAddress:'햇살길 7 · 302호',movers:['da'],head:'eun',relations:{da:'동거인'},existing:[person('eun','최은오','전입지 기존 세대주',3)],speech:'저만 친구 은오네 세대에 들어가요. 은오가 계속 세대주예요. 저희는 가족관계는 아니에요.',report:['문다온만 햇살길 7 · 301호로 이동합니다.','최은오의 기존 세대에 편입합니다. 은오가 세대주를 유지합니다.','다온과 은오는 가족관계가 아니며 다온의 관계는 동거인입니다.'],ending:'은오랑 같은 세대로 잘 등록됐네요. 저녁은 제가 사야겠어요.'}),
    make({id:'M05',title:'마지막 한 자리',subtitle:'상세주소 추가 확인',resident:'yeo',people:[person('yeo','한여울','신고인 · 성인',2)],oldHead:'yeo',oldAddress:'들꽃길 3 · 204호',oldRelations:{yeo:'본인'},newAddress:'새봄로 21 · 302호',wrongAddress:'새봄로 21 · 301호',movers:['yeo'],head:'yeo',relations:{yeo:'본인'},addressQuestion:true,speech:'새봄로 21로 이사했어요. 혼자 새 세대를 만들 거예요. 아, 신고 내용에 호수를 빠뜨렸네요.',report:['한여울 한 사람 이동, 새 세대 구성, 세대주는 한여울입니다.','새봄로 21 건물까지 확인되었지만 상세주소는 비어 있습니다.','정확한 호수를 주민에게 질문하고 기록해 주세요.'],questions:[{id:'address',label:'정확한 호수가 몇 호인가요?',answer:'302호예요. 여기 수정한 신고 내용을 드릴게요. 새봄로 21, 302호가 맞습니다.',factIds:['address']}],hints:['자료철의 신고 내용에서 아직 비어 있는 항목을 찾아보세요.','호수를 추측하지 말고 질문창에서 정확한 호수를 확인하세요.','주민의 답변으로 302호를 확인한 뒤 새 세대와 본인 관계를 기록하세요.'],ending:'호수를 빠뜨릴 뻔했네요. 다시 물어봐 주셔서 감사합니다.'}),
    make({id:'M06',title:'오늘은 안내까지',subtitle:'확인 자료 보완 안내',resident:'su',people:[person('mi','배민서','기존 세대주 · 성인',1),person('su','배수아','신고인 · 민서의 자녀',0)],oldHead:'mi',oldAddress:'나무길 16 · 101호',oldRelations:{mi:'본인',su:'자녀'},newAddress:'온기길 4 · 402호',wrongAddress:'온기길 4 · 401호',movers:['su'],head:'ji',relations:{su:'동거인'},existing:[person('ji','강지후','전입지 기존 세대주',3)],pending:true,speech:'저만 지후네 세대로 들어가요. 가족은 아니에요. 그런데 지후의 확인 자료를 아직 준비하지 못했어요.',report:['배수아만 온기길 4 · 402호, 강지후의 기존 세대에 편입할 요청입니다.','지후가 세대주를 유지하며 수아는 동거인입니다.','이번 사례에서는 전입지 세대주 확인 자료가 아직 제시되지 않았습니다.'],hints:['자료철에서 준비되지 않은 항목을 확인하세요.','확인 자료가 없는 상태에서 등록을 확정하지 않습니다. 검토에서 보완 안내를 선택하세요.','전입지 세대주 확인 자료 보완을 선택하면 오늘의 안내를 마칠 수 있습니다.'],ending:'어떤 확인이 필요한지 알겠어요. 준비해서 다시 올게요.'})
  ];

<script>
(function(){'use strict';const $=id=>document.getElementById(id),S=window.CenterStorage,M=window.MoveInStorage,W=window.WelfareStorage,D=window.WelfareData,E=window.WelfareEngine,esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));const store=S.createStorage({getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v)},navigator.locks),loaded=store.load();let model=loaded.model,protectedRaw=loaded.protectedRaw,originalExported=false,conflict=false,bridge=null,frame=null,kind=null,previewModel=null,launchToken=null,chain=Promise.resolve(),pendingImport=null,lastFocus=null,noticeText=loaded.reason||(!navigator.locks?'자동 저장 제한 · 종료 전 백업을 내보내 주세요.':'근무 기록이 이 브라우저에 저장됩니다.'),unsaved=false;

 $('hub').innerHTML=`<section class="welcome"><span class="eyebrow">MOTUNGI · RESIDENT CENTER</span><h1>이야기를 듣고,<br>필요한 도움을 이어갑니다.</h1><p>복지상담실에서 주민의 말과 기록을 비교해 상담을 연결하세요. 처음부터 정식 근무를 시작할 수 있습니다. 전입창구도 원하는 때 선택할 수 있어요.</p></section>
 <section class="desk-grid"><article class="desk-card welfare-card"><span class="status-label">01 · 복지상담실 · 바로 근무 가능</span><span class="desk-symbol" aria-hidden="true">◎ ─ ◇</span><h2>기록 너머의 하루</h2><p>식사·돌봄·주거·생활비·디지털 도움·일자리. 서로 다른 주민의 이야기를 듣고 직접 판단합니다.</p><div class="level-summary">${D.levels.map(level=>`<span class="level-chip ${level.id}">난이도 ${level.label} · ${D.cases.filter(c=>c.difficulty===level.id&&model.welfare.records[c.shortId]).length}/${D.cases.filter(c=>c.difficulty===level.id).length}건</span>`).join('')}</div><small>완료 상담 ${completed}/${D.cases.length}건 · 작성 중 ${drafts}건</small><button class="primary" data-open="welfare">${resumable?'작성 중 상담 이어하기':active&&model.welfare.records[active]?'최근 상담 기록·답신 보기':next?completed?'다음 미완료 상담 시작 →':'첫 상담 시작하기 →':'최근 상담 기록 보기'}</button><button data-action="case-catalog">상담 사례 고르기 · ${D.cases.length}건</button><button data-open="preview">첫 상담 체험 · 정식 기록 제외</button></article>
 <article class="desk-card"><span class="status-label">02 · 전입창구</span><span class="desk-symbol" aria-hidden="true">⌂ → ⌂</span><h2>새 주소로 옮겨드립니다.</h2><p>누가 이사했고, 누구를 기준으로 관계를 기록할까요? 주민의 말과 이전 기록을 보고 직접 작성합니다.</p><small>완료 접수 ${moveDone}건 · 근무 결산 ${model.moveIn.dayClosed.length}/4일</small><button class="primary move-primary" data-open="movein">${model.moveIn.active||model.moveIn.tutorial?.active?'전입창구 이어하기':'전입창구 출근하기 →'}</button></article></section>
 <p class="hub-note">처음이라면 하 난이도부터 시작해 보세요. 질문·도움·수정에 감점은 없습니다. 자료를 읽어도 답이 자동으로 채워지지 않아요. ${!navigator.locks?'현재 환경은 자동 저장이 제한됩니다. 종료 전 백업을 내보내 보관하세요.':''}</p>
 ${completed?`<section class="record-list"><h2>인계한 상담 기록</h2>${D.cases.filter(c=>model.welfare.records[c.shortId]).map(c=>`<button data-record="${c.shortId}">${esc(c.title)} · ${model.welfare.seenReplyIds.includes(c.epilogue.eventId)?'기록 열람':'답신 확인 가능'}</button>`).join('')}</section><div class="items">기념품 · ${D.cases.filter(c=>model.welfare.records[c.shortId]).map(c=>esc(c.itemName)).join(' · ')}</div>`:''}<section class="record-list"><button data-action="legacy-import">기존 전입 기록 가져오기</button><button data-action="file-import">백업 파일 가져오기</button></section>`;notice(noticeText,unsaved||!loaded.ok);
 }
 function showCatalog(filter='all'){
 const levels=filter==='all'?D.levels:D.levels.filter(x=>x.id===filter);
 const body=`<p>원하는 상담을 선택하세요. 다른 사례를 열어도 작성 중인 초안은 그대로 남습니다. 완료 사례는 기록 열람 또는 체험으로 다시 풀 수 있어요.</p><div class="catalog-filters" aria-label="난이도 선택">${[{id:'all',label:'전체 9건'},...D.levels.map(x=>({id:x.id,label:'난이도 '+x.label}))].map(x=>`<button data-level="${x.id}" aria-pressed="${filter===x.id}">${x.label}</button>`).join('')}</div>${levels.map(level=>`<section class="catalog-level"><h3><span class="level-chip ${level.id}">${level.label}</span> ${level.name} · ${D.cases.filter(c=>c.difficulty===level.id).length}건</h3><p class="catalog-description">${level.description}</p><div class="catalog-grid">${D.cases.filter(c=>c.difficulty===level.id).map(c=>{const done=model.welfare.records[c.shortId],draft=model.welfare.drafts[c.shortId],reply=done&&!model.welfare.seenReplyIds.includes(c.epilogue.eventId);return `<article class="case-card"><div class="case-top"><span>${c.shortId} · ${esc(c.topic)}</span><b>${done?reply?'답신 도착':'완료':draft?'작성 중':'새 상담'}</b></div><h4>${esc(c.title)}</h4><p>${esc(c.focus)}</p><small>인물 ${c.people.length}명 · 판단 ${c.claimDefinitions.length}개${c.priorities?' · 연결 순서 판단':''}</small><button class="${done?'':'primary'}" data-case="${c.shortId}">${done?'기록·답신 보기':draft?'내 초안 이어하기':'상담 시작 →'}</button><button class="practice-link" data-practice="${c.shortId}">체험으로 ${done?'다시 풀기':'살펴보기'}</button></article>`;}).join('')}</div></section>`).join('')}`;
 showDialog('복지상담 사례철',body,'<button data-action="close-dialog">업무 선택으로</button>');
 }
 function showDialog(title,body,actions='<button data-action="close-dialog">닫기</button>'){lastFocus=document.activeElement;$('center-dialog-title').textContent=title;$('center-dialog-body').innerHTML=body;$('center-dialog-actions').innerHTML=actions;if(!$('center-dialog').open)$('center-dialog').showModal();}
 function closeDialog(){$('center-dialog').close();lastFocus?.focus({preventScroll:true});}
 function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
 async function exportCurrent(){if(bridge)await bridge.flush();await chain;download(JSON.stringify(model,null,2),'모퉁이동_두업무_기록.json');notice('현재 센터 기록을 내보냈습니다. 상담 체험 결과는 정식 백업에 포함되지 않습니다.');}
 function settings(){showDialog('나의 근무 기록',`<p>전입 ${Object.keys(model.moveIn.records).length}건 · 복지 ${Object.keys(model.welfare.records).length}건</p><div class="settings-grid"><button data-action="export">현재 센터 기록 내보내기</button>${protectedRaw?'<button data-action="original-export">읽지 못한 원본 그대로 내보내기</button><button data-action="recover" '+(!navigator.locks?'disabled':'')+'>원본 보관 후 현재 기록으로 복구</button>':''}${conflict?'<button data-action="reload">현재 초안 백업 후 최신 기록 불러오기</button>':''}${unsaved?'<button data-action="retry">저장 다시 시도</button>':''}${frame?'':'<button data-action="legacy-import">기존 전입 기록 가져오기</button><button data-action="file-import">백업 파일 가져오기</button>'}</div><small>기존 전입 독립판의 기록은 그대로 보존합니다. 기록 가져오기는 내용을 확인한 뒤 적용합니다.</small>`);}
 function detach(){bridge?.dispose();bridge=null;frame?.remove();frame=null;kind=null;previewModel=null;launchToken=null;}
 async function leave(){if(!bridge)return;notice('진행 중 초안 저장 확인 중…');frame.inert=true;const r=await bridge.flush();frame.inert=false;if(!r.ok&&!r.memory){showDialog('저장 확인이 필요합니다.',`<p>${esc(r.reason)}</p><p>현재 업무 화면은 유지하고 있습니다.</p>`,'<button data-action="retry-return">다시 시도</button><button data-action="export">현재 초안 내보내기</button><button data-action="backup-return">백업하고 업무 선택으로</button>');return;}const saved=await commit(m=>m.route='hub');if(!saved.ok&&!saved.memory)return;detach();renderHub();}

 async function launch(type,recordId){if(frame)return;if(recordId&&!D.get(recordId))return;const isPreview=type==='preview';if(!isPreview){const saved=await commit(m=>{m.route=type;m.hub.lastDesk=type;if(type==='welfare'){const id=recordId||m.welfare.active||D.cases.find(c=>!m.welfare.records[c.shortId])?.shortId||D.cases.at(-1).shortId;m.welfare.active=id;if(!m.welfare.records[id]&&!m.welfare.drafts[id])m.welfare.drafts[id]=E.createSession(D.get(id));}});if(!saved.ok&&!saved.memory)return;}
 kind=type;const data=type==='movein'?model.moveIn:isPreview?W.blank():model.welfare;if(isPreview){data.active=recordId||'W01';previewModel=data;}const token=crypto.randomUUID();launchToken=token;frame=document.createElement('iframe');frame.title=type==='movein'?'전입창구':'복지상담실';frame.setAttribute('sandbox','allow-scripts allow-downloads');$('desk').replaceChildren(frame);$('hub').hidden=true;$('desk').hidden=false;$('return').hidden=false;$('subtitle').textContent=type==='movein'?'전입창구':isPreview?'복지상담 체험 · 정식 기록 제외':'복지상담실';$('center').classList.add('in-desk');
 bridge=window.CenterBridge.createBridge({frame,token,kind:type,validate:m=>type==='movein'?M.validate(m).valid:W.validate(m),persist:async m=>{if(type==='preview'){previewModel=S.clone(m);return {ok:true,memory:true};}const previous=type==='movein'?model.moveIn.records:model.welfare.records;if(Object.entries(previous).some(([id,r])=>JSON.stringify(m.records[id])!==JSON.stringify(r)))return {ok:false,reason:'완료 기록은 업무 화면에서 변경할 수 없습니다.'};return commit(n=>{if(type==='movein')n.moveIn=M.pack(m);else n.welfare=S.clone(m);});},onIssue:text=>notice(text,true)});
 const encoded=type==='movein'?window.__CENTER_CHILDREN__.movein:window.__CENTER_CHILDREN__.welfare,html=new TextDecoder().decode(Uint8Array.from(atob(encoded),c=>c.charCodeAt(0))),config=JSON.stringify({protocol:2,token,kind:isPreview?'preview':'center',allowNewCases:true,model:data}).replace(/</g,'\\u003c');frame.srcdoc=html.replace('__EMBED_CONFIG__',config);}
 function prepareImport(raw){const legacy=M.parse(raw),center=S.parse(raw);if(!legacy.valid&&!center.valid){notice('이 백업은 현재 버전에서 읽을 수 없습니다. 원본을 보관해 주세요.',true);return;}pendingImport=legacy.valid?{kind:'legacy',model:legacy.model}:{kind:'center',model:center.model};const next=legacy.valid?legacy.model:center.model.moveIn;showDialog('적용할 기록을 확인해 주세요.',`<p>전입 완료 ${Object.keys(model.moveIn.records).length}건 → ${Object.keys(next.records).length}건</p><p>${legacy.valid?'전입 초안과 기념품은 가져온 내용으로 교체하고, 복지 기록은 유지합니다. 기존 전입 저장 키는 수정하지 않습니다.':'센터 전체 초안·완료·기념품을 가져온 백업으로 교체합니다.'}</p><p>현재 기록을 먼저 백업한 뒤 적용합니다. 취소하면 바뀌지 않습니다.</p>`,'<button data-action="cancel-import">취소</button><button class="primary" data-action="apply-import">현재 백업 보관 · 적용</button>');}
 document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.case){closeDialog();await launch('welfare',d.case);return;}if(d.practice){closeDialog();await launch('preview',d.practice);return;}if(d.level){showCatalog(d.level);document.querySelector('[data-level="'+d.level+'"]')?.focus({preventScroll:true});return;}if(d.action==='case-catalog'){showCatalog();return;}if(d.open){await launch(d.open);return;}if(d.record){await launch('welfare',d.record);return;}if(b.id==='return'){await leave();return;}if(b.id==='settings'){settings();return;}if(b.id==='center-dialog-close'||d.action==='close-dialog'){closeDialog();return;}
 if(d.action==='export')await exportCurrent();else if(d.action==='backup-return'){await exportCurrent();model.route='hub';unsaved=true;detach();closeDialog();renderHub();notice('백업을 내보냈습니다. 현재 기록은 아직 자동 저장되지 않았습니다.',true);}else if(d.action==='retry-return'){closeDialog();await leave();}else if(d.action==='retry'){const r=bridge?await bridge.flush():await commit(()=>{});if(r.ok||r.memory){closeDialog();if(!frame)renderHub();}}else if(d.action==='original-export'){download(protectedRaw,'모퉁이동_읽지못한원본.json');originalExported=true;notice('원본을 내보냈습니다. 복구 전에 파일을 보관해 주세요.');}else if(d.action==='recover'){if(!originalExported){notice('먼저 읽지 못한 원본을 그대로 내보내 주세요.',true);return;}showDialog('현재 기록으로 복구할까요?','<p>내보낸 원본을 보관해 주세요. 이 브라우저의 센터 저장을 현재 플레이 기록으로 교체합니다. 기존 전입 독립판의 저장은 바꾸지 않습니다.</p>','<button data-action="close-dialog">취소</button><button class="primary" data-action="apply-recover">현재 기록으로 복구</button>');}else if(d.action==='apply-recover'){if(bridge)await bridge.flush();const r=await store.recover(model);if(r.ok){model=r.model;protectedRaw='';unsaved=false;conflict=false;closeDialog();notice('기록 저장을 복구했습니다.');}else notice(r.reason,true);}else if(d.action==='reload'){await exportCurrent();const n=store.load();if(n.ok){detach();model=n.model;unsaved=false;conflict=false;closeDialog();renderHub();}else notice(n.reason,true);}else if(d.action==='legacy-import'){if(frame)return;try{const raw=localStorage.getItem(M.KEY);if(!raw){showDialog('가져올 기록이 없습니다.','<p>이 브라우저에 기존 전입 기록이 없습니다. 다른 브라우저에서 내보낸 JSON 백업 파일도 가져올 수 있어요.</p>','<button data-action="file-import">백업 파일 선택</button>');}else prepareImport(raw);}catch(e){notice('기존 기록을 읽지 못했습니다. 백업 파일로 가져와 주세요.',true);}}else if(d.action==='file-import'){if(!frame)$('center-import').click();}else if(d.action==='cancel-import'){pendingImport=null;closeDialog();}else if(d.action==='apply-import'&&pendingImport){download(JSON.stringify(model,null,2),'모퉁이동_가져오기전_센터기록.json');const p=pendingImport,r=await commit(m=>{if(p.kind==='legacy')m.moveIn=M.pack(p.model);else{const revision=m.saveRevision;Object.assign(m,S.clone(p.model));m.saveRevision=revision;}m.route='hub';});if(r.ok||r.memory){pendingImport=null;closeDialog();renderHub();}else notice(r.reason,true);}});
 $('center-import').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>S.LIMIT){notice('백업 파일은 2MB 이하로 가져와 주세요.',true);return;}prepareImport(await f.text());});$('center-dialog').addEventListener('cancel',e=>{e.preventDefault();pendingImport=null;closeDialog();});
 window.addEventListener('message',e=>{bridge?.handle(e).catch(err=>notice('진행 기록 저장을 다시 시도해 주세요.',true));if(e.source===frame?.contentWindow&&e.data?.channel==='resident-center-return'&&e.data?.protocol===2&&e.data.token===launchToken)leave();});window.addEventListener('storage',e=>{if(e.key===S.KEY){conflict=true;notice('다른 창에서 기록이 바뀌었습니다. 기록 메뉴에서 초안을 백업하고 최신 기록을 불러와 주세요.',true);}});let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{document.body.classList.toggle('large-text',parseFloat(getComputedStyle(document.documentElement).fontSize)>22);},100);});
 renderHub();if(model.route==='movein'||model.route==='welfare')launch(model.route);
})();

</script></body></html>
