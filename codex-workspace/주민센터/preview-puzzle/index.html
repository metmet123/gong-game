<body><div class="game" id="game">
 <header class="topbar"><button class="back icon-button" id="back" aria-label="이전 화면">←</button><div class="brand"><span class="brand-mark">모</span><div><b id="header-title">모퉁이동 주민센터</b><small id="header-subtitle">전입신고 담당 주무관</small></div></div><button class="menu-button" data-do="settings" aria-label="저장과 설정 열기">기록 · 설정</button></header>
 <section class="resident-bar" id="resident-bar" hidden></section>
 <nav class="stages" id="stages" aria-label="업무 단계" hidden></nav>

 <footer class="actionbar" id="actionbar"></footer>
</div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sheet-heading"><div><span class="eyebrow" id="sheet-label"></span><h2 id="sheet-title"></h2></div><button class="icon-button" id="sheet-close" aria-label="창 닫기">×</button></div><div class="sheet-body" id="sheet-body"></div><div class="sheet-actions" id="sheet-actions"></div></dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script>
(function(root){
  'use strict';
  const person=(id,name,detail,palette=0)=>({id,name,detail,palette,adult:true});
  function make(spec){
    const c={contentVersion:1,rulesVersion:1,questions:[],...spec};
    c.visitId=c.visitId||c.id;
    c.addresses=[{id:c.id+'-home',label:c.newAddress,existing:c.existing||[]},{id:c.id+'-other',label:c.wrongAddress,existing:[]}];
    c.expected={moverIds:c.movers,addressId:c.addresses[0].id,mode:c.existing?.length?'join':'new',headId:c.head,relations:c.relations,outcome:c.pending?'followup_requested':'registered'};
    c.before={address:c.oldAddress,headId:c.oldHead,memberIds:c.people.map(p=>p.id),relationByPerson:c.oldRelations,active:true};
    c.documents=[{id:'report',title:'전입신고 내용',subtitle:'누가 · 어디로 · 어떤 세대로',status:'provided',lines:c.report,factIds:['request'],check:false},{id:'identity',title:'제시된 확인 자료',subtitle:'가상 사례의 준비 상태',status:'provided',lines:['이 사례의 신고인과 성인 전입자 확인 자료가 준비되어 있습니다.','아래 버튼으로 자료 카드의 준비 상태를 확인해 주세요. 실제 본인 확인을 수행하는 화면은 아닙니다.'],factIds:['identity'],check:true}];
    c.requiredFacts=['request','identity'];
    if(c.existing?.length){c.documents.push({id:'headcheck',title:'전입지 세대주 확인',subtitle:c.pending?'추가 확인이 필요합니다':'확인 자료가 준비되었습니다',status:c.pending?'missing':'provided',lines:c.pending?['기존 세대주 '+c.existing[0].name+'의 확인 자료는 아직 제시되지 않았습니다.','오늘은 확인이 필요한 항목과 재방문 안내를 남길 수 있습니다.']:['이 사례의 전입지 세대주 '+c.existing[0].name+' 확인 자료가 준비되어 있습니다.'],factIds:['headcheck'],check:true});c.requiredFacts.push('headcheck');}
    if(c.addressQuestion)c.requiredFacts.push('address');
    c.followupReasons=[{id:'headcheck',label:'전입지 세대주 확인 자료 보완',guidance:'기존 세대주 확인이 필요한 내용을 안내하고, 확인 자료가 준비되면 다시 방문해 주세요.'},{id:'address',label:'상세주소 재확인',guidance:'정확한 상세주소를 확인해 주세요.'},{id:'movers',label:'이동자 범위 재확인',guidance:'이번에 실제로 이동하는 사람을 확인해 주세요.'}];
    c.hints=c.hints||['신고 내용에서 이동하는 사람과 남는 사람을 먼저 확인하세요.','관계는 이전 세대주가 아니라 이사 후 세대주를 기준으로 기록합니다.',c.report.join(' ')];
    return c;
  }
  const cases=[
    make({id:'M01',title:'첫 번째 주소',subtitle:'한 사람의 새로운 시작',resident:'sae',people:[person('sae','윤새봄','신고인 · 성인',0)],oldHead:'sae',oldAddress:'들꽃길 3 · 101호',oldRelations:{sae:'본인'},newAddress:'모퉁이로 12 · 201호',wrongAddress:'모퉁이로 12 · 202호',movers:['sae'],head:'sae',relations:{sae:'본인'},speech:'저 혼자 이사했어요. 새 주소는 모퉁이로 12, 201호예요. 새집에도 저 혼자 세대를 만들면 됩니다.',report:['윤새봄 한 사람 모두 이동합니다.','새 주소는 모퉁이로 12 · 201호입니다.','새 세대를 구성하며 세대주는 윤새봄입니다.'],ending:'제 첫 독립 주소네요. 이사 온 게 실감 나요.'}),
    make({id:'M02',title:'함께 옮기는 집',subtitle:'세대 전체 이동',resident:'yu',people:[person('yu','서유진','신고인 · 성인',0),person('min','박민재','유진의 배우자 · 성인',1),person('sol','박해솔','유진의 자녀 · 성인',2)],oldHead:'yu',oldAddress:'나무길 8 · 101호',oldRelations:{yu:'본인',min:'배우자',sol:'자녀'},newAddress:'모퉁이로 12 · 202호',wrongAddress:'모퉁이로 12 · 201호',movers:['yu','min','sol'],head:'yu',relations:{yu:'본인',min:'배우자',sol:'자녀'},speech:'저희 세 사람 모두 이사했어요. 새집은 모퉁이로 12, 202호입니다. 세대주는 그대로 저예요.',report:['서유진·박민재·박해솔 모두 이동합니다.','새 주소는 모퉁이로 12 · 202호, 새 세대를 구성합니다.','세대주는 유진입니다. 민재는 유진의 배우자, 해솔은 성인 자녀입니다.'],ending:'세 사람의 새집 주소가 잘 등록됐네요. 감사합니다.'}),
    make({id:'M03',title:'첫 독립, 둘이 함께',subtitle:'세대 일부 이동',resident:'ga',people:[person('chae','김채림','기존 세대주 · 성인',3),person('ga','이가온','신고인 · 채림의 자녀',0),person('bo','이보람','가온의 동생 · 성인',2)],oldHead:'chae',oldAddress:'나무길 8 · 101호',oldRelations:{chae:'본인',ga:'자녀',bo:'자녀'},newAddress:'모퉁이로 12 · 202호',wrongAddress:'모퉁이로 12 · 201호',movers:['ga','bo'],head:'ga',relations:{ga:'본인',bo:'형제자매'},speech:'저와 동생 보람만 이사했어요. 어머니 채림은 원래 집에 계세요. 새 세대주는 저예요.',report:['이가온과 이보람만 모퉁이로 12 · 202호로 이동합니다.','김채림은 이전 집의 세대주로 남습니다.','새 세대주 이가온을 기준으로 보람은 형제자매입니다.'],ending:'이제 정말 저희 집 주소가 생겼네요. 이삿짐 정리하러 갈게요.'}),
    make({id:'M04',title:'친구의 집으로',subtitle:'기존 세대 편입',resident:'da',people:[person('jun','문준서','기존 세대주 · 성인',1),person('da','문다온','신고인 · 준서의 형제자매',2)],oldHead:'jun',oldAddress:'나무길 8 · 101호',oldRelations:{jun:'본인',da:'형제자매'},newAddress:'햇살길 7 · 301호',wrongAddress:'햇살길 7 · 302호',movers:['da'],head:'eun',relations:{da:'동거인'},existing:[person('eun','최은오','전입지 기존 세대주',3)],speech:'저만 친구 은오네 세대에 들어가요. 은오가 계속 세대주예요. 저희는 가족관계는 아니에요.',report:['문다온만 햇살길 7 · 301호로 이동합니다.','최은오의 기존 세대에 편입합니다. 은오가 세대주를 유지합니다.','다온과 은오는 가족관계가 아니며 다온의 관계는 동거인입니다.'],ending:'은오랑 같은 세대로 잘 등록됐네요. 저녁은 제가 사야겠어요.'}),
    make({id:'M05',title:'마지막 한 자리',subtitle:'상세주소 추가 확인',resident:'yeo',people:[person('yeo','한여울','신고인 · 성인',2)],oldHead:'yeo',oldAddress:'들꽃길 3 · 204호',oldRelations:{yeo:'본인'},newAddress:'새봄로 21 · 302호',wrongAddress:'새봄로 21 · 301호',movers:['yeo'],head:'yeo',relations:{yeo:'본인'},addressQuestion:true,speech:'새봄로 21로 이사했어요. 혼자 새 세대를 만들 거예요. 아, 신고 내용에 호수를 빠뜨렸네요.',report:['한여울 한 사람 이동, 새 세대 구성, 세대주는 한여울입니다.','새봄로 21 건물까지 확인되었지만 상세주소는 비어 있습니다.','정확한 호수를 주민에게 질문하고 기록해 주세요.'],questions:[{id:'address',label:'정확한 호수가 몇 호인가요?',answer:'302호예요. 여기 수정한 신고 내용을 드릴게요. 새봄로 21, 302호가 맞습니다.',factIds:['address']}],hints:['자료철의 신고 내용에서 아직 비어 있는 항목을 찾아보세요.','호수를 추측하지 말고 질문창에서 정확한 호수를 확인하세요.','주민의 답변으로 302호를 확인한 뒤 새 세대와 본인 관계를 기록하세요.'],ending:'호수를 빠뜨릴 뻔했네요. 다시 물어봐 주셔서 감사합니다.'}),

    for(const mode of ['puzzle','chapter']){const seq=mode==='puzzle'?D.puzzle:D.visits;let gap=false;for(let i=0;i<seq.length;i++){const r=model.records[mode+':'+seq[i].visitId];if(!r)gap=true;else if(gap||mode==='chapter'&&i>=3&&!model.dayClosed?.includes(Math.floor(i/3)))return {valid:false,reason:'접수 진행 순서가 올바르지 않습니다.'};}}
    if(!model.drafts||typeof model.drafts!=='object'||Array.isArray(model.drafts)||Object.keys(model.drafts).length>24)return {valid:false,reason:'초안 목록이 올바르지 않습니다.'};
    for(const [key,s] of Object.entries(model.drafts)){const [mode,id,...rest]=key.split(':'),c=D.get(id);if(rest.length||!['puzzle','chapter'].includes(mode)||!c||(mode==='puzzle'&&!D.puzzle.includes(c))||!E.validateSession(c,s)||s.status!=='editing'||s.record!==null||s.undo.length||s.redo.length)return {valid:false,reason:'보관된 초안을 복원할 수 없습니다.'};}
    if(!Array.isArray(model.items)||new Set(model.items).size!==model.items.length||model.items.some(x=>!['badge','memo','map','photo'].includes(x)))return {valid:false,reason:'기념품 기록이 올바르지 않습니다.'};
    if(!Array.isArray(model.dayClosed)||model.dayClosed.some((d,i)=>d!==i+1)||model.dayClosed.length>4)return {valid:false,reason:'근무 기록이 올바르지 않습니다.'};
    for(const day of model.dayClosed){const ids=D.visits.slice((day-1)*3,day*3).map(c=>c.visitId);if(ids.some(id=>!model.records['chapter:'+id]))return {valid:false,reason:'근무 결산에 필요한 접수 기록이 없습니다.'};}
    if(typeof model.introduced!=='boolean'||!model.settings||typeof model.settings.motion!=='boolean'||typeof model.settings.sound!=='boolean'||!model.map||![model.map.x,model.map.y].every(Number.isInteger)||!C.path(model.map,model.map))return {valid:false,reason:'설정 또는 지도 기록이 올바르지 않습니다.'};
    if(model.active){const c=D.get(model.active.visitId),s=model.active.session;if(!c||model.active.mode!==model.mode||typeof model.active.practice!=='boolean'||!E.validateSession(c,s)||s.undo.length||s.redo.length)return {valid:false,reason:'진행 중 초안을 복원할 수 없습니다.'};if(model.mode==='puzzle'&&!D.puzzle.includes(c))return {valid:false,reason:'접수 범위가 올바르지 않습니다.'};if(s.status==='resolved'&&(!validRecord(c,s.record)||JSON.stringify(s.record)!==JSON.stringify(model.records[model.mode+':'+c.visitId])&&!model.active.practice))return {valid:false,reason:'처리 결과가 완료 기록과 다릅니다.'};if(s.status==='editing'&&s.record!==null)return {valid:false,reason:'초안 상태가 올바르지 않습니다.'};}
    if(model.items.includes('badge')&&!Object.values(model.records).some(r=>r.outcome==='registered'))return {valid:false,reason:'기념품 획득 근거가 없습니다.'};
    if(model.items.includes('memo')&&!model.dayClosed.includes(2)||model.items.includes('map')&&!model.records['chapter:M06-return']||model.items.includes('photo')&&!model.dayClosed.includes(4))return {valid:false,reason:'기념품 획득 근거가 없습니다.'};
    return {valid:true,reason:''};
  }
  function parse(text){try{if(typeof text!=='string'||text.length>LIMIT)return {valid:false,reason:'백업 파일이 너무 크거나 형식이 다릅니다.'};const model=JSON.parse(text),check=validate(model);return {...check,model:check.valid?model:null};}catch(e){return {valid:false,reason:'백업 파일을 읽을 수 없습니다.'};}}
  function createStorage(adapter){let blocked=false;
    function load(){try{const raw=adapter.getItem(KEY);if(!raw)return {model:blank(),ok:true};const p=parse(raw);if(!p.valid){blocked=true;return {model:blank(),ok:false,protectedRaw:raw,reason:p.reason};}return {model:p.model,ok:true};}catch(e){return {model:blank(),ok:false,reason:'자동 저장을 사용할 수 없습니다. 백업을 내보내 주세요.'};}}
    function save(model){if(blocked)return {ok:false,reason:'읽지 못한 원본을 보호하고 있습니다. 백업을 내보낸 뒤 저장 복구를 선택해 주세요.'};const packed=pack(model),check=validate(packed);if(!check.valid)return {ok:false,reason:check.reason};try{const existing=adapter.getItem(KEY);if(existing){const parsed=parse(existing);if(!parsed.valid){blocked=true;return {ok:false,reason:'저장 원본을 보호하고 있습니다.'};}if(parsed.model.saveRevision!==model.saveRevision)return {ok:false,conflict:true,reason:'다른 창에서 기록이 바뀌었습니다. 최신 기록을 불러와 주세요.'};}packed.saveRevision++;packed.savedAt=new Date().toISOString();adapter.setItem(KEY,JSON.stringify(packed));return {ok:true,model:packed};}catch(e){return {ok:false,reason:'저장을 완료하지 못했습니다. 종료 전에 백업을 내보내 주세요.'};}}
    function recover(model){const packed=pack(model),check=validate(packed);if(!check.valid)return {ok:false,reason:check.reason};try{packed.saveRevision++;packed.savedAt=new Date().toISOString();adapter.setItem(KEY,JSON.stringify(packed));blocked=false;return {ok:true,model:packed};}catch(e){return {ok:false,reason:'이 환경에서 저장할 수 없습니다. 백업 파일을 사용해 주세요.'};}}
    return {load,save,recover};
  }
  const api={KEY,LIMIT,blank,pack,validate,parse,validRecord,createStorage};if(node)module.exports=api;else root.MoveInStorage=api;
})(typeof globalThis!=='undefined'?globalThis:this);

</script>
<script>
(function(root){
  'use strict';
  const node=typeof module!=='undefined'&&module.exports,E=node?require('../engine/resolve.js'):root.MoveInEngine,D=node?require('../data/cases.js'):root.MoveInData,C=node?require('../data/chapter.js'):root.MoveInChapter;
  const sequence=mode=>mode==='chapter'?D.visits:D.puzzle;
  function next(model){return sequence(model.mode).find(c=>!model.records[model.mode+':'+c.visitId])||null;}
  function currentDay(model){return C.days.find(d=>!model.dayClosed.includes(d.day))||null;}
  function available(model,id){const seq=sequence(model.mode),index=seq.findIndex(c=>c.visitId===id);return index>=0&&(!!model.records[model.mode+':'+id]||seq.slice(0,index).every(c=>model.records[model.mode+':'+c.visitId]))&&(model.mode!=='chapter'||!!model.records['chapter:'+id]||currentDay(model)?.visits.includes(id));}
  function stash(model){const n=E.clone(model);if(n.active&&!n.active.practice&&n.active.session.status==='editing')n.drafts[n.active.mode+':'+n.active.visitId]=E.clone(n.active.session);return n;}
  function start(model,id,practice=false){if(!D.get(id)||!available(model,id))return {accepted:false,reason:'이전 접수와 근무 결산을 먼저 마쳐 주세요.'};const key=model.mode+':'+id;if(model.records[key]&&!practice)return {accepted:false,reason:'완료 기록입니다. 연습으로 열어 주세요.'};const n=stash(model);n.active={mode:model.mode,visitId:id,practice,session:!practice&&n.drafts[key]?E.clone(n.drafts[key]):E.createSession(D.get(id))};return {accepted:true,model:n};}
  function commit(model,session){if(!model.active||session.visitId!==model.active.visitId||session.status!=='resolved')return {accepted:false,reason:'접수 상태가 맞지 않습니다.'};const n=E.clone(model);n.active.session=session;const key=n.mode+':'+session.visitId;if(n.active.practice)return {accepted:true,model:n};if(n.records[key])return {accepted:false,reason:'이미 기록된 접수입니다.'};n.records[key]=E.clone(session.record);delete n.drafts[key];if(session.record.outcome==='registered'&&!n.items.includes('badge'))n.items.push('badge');if(n.mode==='chapter'&&session.visitId==='M06-return'&&!n.items.includes('map'))n.items.push('map');return {accepted:true,model:n};}
  function closeDay(model){const day=currentDay(model);if(!day||day.visits.some(id=>!model.records['chapter:'+id]))return {accepted:false,reason:'오늘의 세 접수를 먼저 마쳐 주세요.'};const n=E.clone(model);n.dayClosed.push(day.day);if(day.day===2&&!n.items.includes('memo'))n.items.push('memo');if(day.day===4&&!n.items.includes('photo'))n.items.push('photo');n.active=null;return {accepted:true,model:n,day};}
  const api={sequence,next,currentDay,available,start,commit,closeDay,stash};if(node)module.exports=api;else root.MoveInCampaign=api;
})(typeof globalThis!=='undefined'?globalThis:this);

</script>
<script>
(function(root){
  'use strict';
  root.createTutorialView=function(ctx){
    const {$,T,esc,avatar}=ctx,c=T.case,name=id=>c.people.find(p=>p.id===id)?.name||'미지정';
    function person(id,isNew,head){return `<button class="first-person ${id===head?'anchor':''}" data-first-move="${id}" aria-label="${name(id)} ${isNew?'이전 집으로 돌려놓기':'새집에 기록하기'}">${avatar(c.people.find(p=>p.id===id))}<b>${name(id)}</b><small>${isNew?'← 돌려놓기':'새집으로 →'}</small></button>`;}
    function house(t,isNew){const d=t.session.draft,ids=c.people.map(p=>p.id).filter(id=>isNew?d.moverIds.includes(id):!d.moverIds.includes(id));return `<section class="first-house ${isNew?'new':''}"><div class="first-house-title"><b>${isNew?'새집의 주소 기록':'이전 집의 주소 기록'}</b><small>${ids.length}명 ${isNew?'예정':'남음'}</small></div><p class="first-address">${isNew?c.addresses[0].label:c.before.address}</p><div class="first-people">${ids.map(id=>person(id,isNew,d.destinationHeadId)).join('')||'<div class="first-empty">아직 기록한 사람이 없어요.</div>'}</div>${isNew?`<p class="first-note">이 집에서 누구를 기준으로 관계를 적을까요?</p><div class="first-heads">${ids.map(id=>`<button data-first-head="${id}" class="${d.destinationHeadId===id?'active':''}" aria-pressed="${d.destinationHeadId===id}">${name(id)} 기준</button>`).join('')}</div>`:''}</section>`;}
    function relations(t){const d=t.session.draft,h=d.destinationHeadId;if(!h)return '<p class="first-note">새집에 사람을 놓고 기준 사람을 선택하면 관계를 작성할 수 있어요.</p>';return `<p class="first-self">기준 사람 <b>${name(h)}</b> · 본인</p>${d.moverIds.filter(id=>id!==h).map(id=>`<div class="first-relation"><label for="first-rel-${id}"><b>${name(id)}</b>은 ${name(h)}의 누구인가요?<small>지금 기준: ${name(h)}</small></label><select id="first-rel-${id}" data-first-rel="${id}" aria-label="${name(id)}과 ${name(h)}의 관계"><option value="">직접 선택</option>${['배우자','자녀','부모','형제자매','동거인'].map(r=>`<option ${d.relationByPerson[id]===r?'selected':''}>${r}</option>`).join('')}</select></div>`).join('')}<p class="first-note">이 사례에서 ‘세대주’는 새집의 관계 기록에서 기준이 되는 사람입니다. 이전 집과 기준이 같다고 가정하지 마세요.</p>`;}
    function steps(t){const d=t.session.draft;const complete=[d.moverIds.length>0,!!d.destinationHeadId,!!d.destinationHeadId&&d.moverIds.every(id=>d.relationByPerson[id])];return `<ol class="first-steps" aria-label="직접 작성할 순서">${['이사한 사람 기록','관계 기준 선택','기준과의 관계 작성'].map((label,i)=>`<li class="${complete[i]?'filled':''}"><span>${complete[i]?'✓':i+1}</span>${label}<small>${complete[i]?'선택함 · 정답 검토 전':'직접 판단'}</small></li>`).join('')}</ol>`;}
    function paper(t){const d=t.session.draft,remaining=c.people.filter(p=>!d.moverIds.includes(p.id));return `<section class="first-paper"><h2>내가 만든 신고 기록 · 미확정</h2><dl><dt>옮기는 사람</dt><dd>${d.moverIds.map(name).join(' · ')||'아직 미지정'}</dd><dt>남는 사람</dt><dd>${remaining.map(p=>p.name).join(' · ')||'없음'}</dd><dt>새 주소</dt><dd>${c.addresses[0].label}<small>주민이 제시한 주소</small></dd><dt>세대주</dt><dd>${name(d.destinationHeadId)}</dd><dt>관계</dt><dd>${d.moverIds.map(id=>name(id)+': '+(d.relationByPerson[id]||'아직 미지정')).join('<br>')||'아직 미지정'}</dd></dl></section><section class="first-reasons"><h3>이 관계를 적은 이유는 무엇인가요?</h3>${[['new-head','새집에서 선택한 기준 사람과의 관계로 적었다.'],['copy','이전 집의 관계를 그대로 옮겨 적었다.'],['order','이사한 순서대로 관계를 정했다.']].map(([id,text])=>`<button data-first-reason="${id}" class="${t.reason===id?'active':''}" aria-pressed="${t.reason===id}">${text}</button>`).join('')}</section>${t.attempted?feedback(t):''}`;}
    function feedback(t){const r=T.review(t);return r.issues.length?`<section class="first-feedback" role="status"><h3>내 초안에서 다시 확인할 점</h3><ul>${r.issues.map(i=>`<li>${esc(i.message)}${i.source?`<button data-first-source="${i.source}">관련 근거 다시 보기</button>`:''}</li>`).join('')}</ul><p>작성한 값은 그대로입니다. 근거를 보고 직접 수정해 주세요.</p></section>`:'';}
    function result(t){const snap=t.session.record.afterSnapshot;return `<section class="first-result">${avatar(c.people[1])}<h2>첫 접수를 직접 판단해 마쳤습니다.</h2><div class="first-changes">이전 집: ${snap.origin.memberIds.map(name).join(' · ')}의 주소 유지<br>새집: ${snap.destination.memberIds.map(name).join(' · ')}의 주소 기록<br>기준 사람: ${name(snap.destination.headId)}<br>관계: ${snap.destination.memberIds.filter(id=>id!==snap.destination.headId).map(id=>name(id)+' · '+snap.destination.relationByPerson[id]).join(' · ')}</div><p class="first-explanation">어머니를 기준으로 적은 두 자녀의 관계를 새집의 가온을 기준으로 다시 판단했습니다. 그래서 보람의 관계는 형제자매로 연결됩니다.</p><p class="first-quote">“${esc(c.ending)}”</p><p class="first-note">첫 접수 기록은 저장됩니다. 기존 사례의 완료 기록과 성장 보상은 추가하지 않습니다.</p></section>`;}
    function render(t){const compact=innerHeight<650,phase=t.session.view.phase,done=t.session.status==='resolved';document.body.classList.add('first-contact');$('back').hidden=false;$('header-title').textContent='모퉁이동 주민센터';$('header-subtitle').textContent='첫 접수 · '+(done?'결과':phase==='intake'?'주민의 이야기':phase==='review'?'내 초안 검토':'나의 판단');$('resident-bar').hidden=false;$('resident-bar').innerHTML=`<div class="portrait">${avatar(c.people[phase==='intake'||done?1:2])}</div><div><b>${phase==='intake'||done?'이가온 · 오늘 이사 온 주민':'정서린 · 함께 일하는 선배'}</b><p>${phase==='intake'?'“보람이랑 저는 새집으로 이사를 마쳤어요. 어머니는 원래 집에 계세요.”':done?'“어머니 주소는 그대로고, 저희 둘만 바뀌었네요.”':phase==='review'?(compact?'“내 초안과 관계의 근거를 확인해 보세요.”':'“당신이 작성한 기록이에요. 주민의 말과 관계의 근거가 맞는지 확인해 봐요.”'):(compact?'“사람을 눌러 옮기고, 선택한 기준 사람과의 관계를 판단해 보세요.”':'“사람을 눌러 주소 기록의 위치를 바꿔 보세요. 관계는 선택한 기준 사람을 중심으로 생각하면 돼요.”')}</p></div>`;$('stages').hidden=false;$('stages').innerHTML=`<div class="first-goal"><b>${phase==='intake'?'이사한 주민의 주소를 기록하는 첫 업무':done?'내 판단이 주민의 기록으로 연결됐습니다.':phase==='review'?'내 선택과 판단한 이유를 함께 확인해 주세요.':(compact?'두 집과 관계를 직접 기록해 주세요.':'두 집과 사람 사이의 관계를 직접 기록해 주세요.')}</b><small>${phase==='intake'?'이사는 이미 끝났어요. 직원은 주소 기록을 바꿉니다.':done?'기록은 아래 결과와 같습니다.':phase==='review'?'신고서는 정답 예시가 아니라 내가 만든 초안입니다.':(compact?'아래로 내려 관계까지 작성해 주세요.':'자료로 판단하고, 아래로 내려 관계까지 작성해 주세요.')}</small></div>`;$('tools').hidden=done;$('tools').innerHTML=c.documents.map(doc=>`<button data-first-source="${doc.id}" class="${t.session.knowledge.seenDocumentIds.includes(doc.id)?'read':''}">${{story:'주민의 말',ledger:'이전 기록',request:'대표의 부탁'}[doc.id]}${t.session.knowledge.seenDocumentIds.includes(doc.id)?' · 읽음':''}</button>`).join('');$('work-scroll').innerHTML=`<div id="tutorial-root">${done?result(t):phase==='intake'?'<section class="first-welcome"><h1>두 사람의 첫 독립 주소</h1><p>주민은 이미 이사를 마쳤어요. 직원인 나는 누가 어느 집의 주소 기록에 남고, 누구의 기록이 바뀌는지 정리합니다.</p><p>① 이사한 사람을 새집에 기록 → ② 관계를 적을 기준 사람 선택 → ③ 그 사람과의 관계 작성. 자료를 읽어도 답은 자동으로 채워지지 않아요.</p><p class="first-note">가상의 성인 가족과 주소를 사용합니다. 확인 자료는 준비된 사례이며 실제 절차 전체를 재현하지 않습니다.</p></section>':phase==='review'?paper(t):steps(t)+house(t,false)+house(t,true)+relations(t)}</div>`;$('actionbar').innerHTML=done?'<button data-first-action="leave">접수 목록</button><button class="primary" data-first-action="next">기존 접수 이어가기 →</button>':phase==='intake'?'<button class="primary" data-first-action="work">내가 기록해 보기 →</button>':phase==='review'?`<button data-first-action="work">직접 수정</button><button class="primary" data-first-action="confirm" ${ctx.conflict()?'disabled':''}>근거 확인 · 처리</button>`:'<button data-first-action="help">선배 도움</button><button class="primary" data-first-action="review">내 초안 검토 →</button>';}
    function openSource(id){const doc=c.documents.find(d=>d.id===id);if(!doc)return;let body=doc.lines.map(line=>`<p>${esc(line)}</p>`).join('');if(id==='ledger')body+=`<table class="first-ledger"><thead><tr><th>이름</th><th>김채림과의 관계</th></tr></thead><tbody>${c.people.map(p=>`<tr><td>${p.name}</td><td>${c.before.relationByPerson[p.id]}</td></tr>`).join('')}</tbody></table><p>이 표는 이전 집 기준의 관계입니다. 세 사람은 가상의 성인 가족입니다.</p>`;if(id==='request')body+='<p class="first-note">이 사례에서 기준 사람을 선택할 근거입니다. 실제 세대주 지정 절차 전체를 재현하지 않습니다.</p>';ctx.sheet('판단할 자료',doc.title,body);ctx.act({type:'READ',id});}
    function click(button){const d=button.dataset;if(d.firstSource){openSource(d.firstSource);return true;}if(d.firstMove){ctx.act({type:'MOVE',id:d.firstMove});ctx.notice(name(d.firstMove)+'의 초안 위치를 바꿨어요. 관계는 다시 확인해 주세요.');return true;}if(d.firstHead){ctx.act({type:'HEAD',id:d.firstHead});ctx.notice(name(d.firstHead)+'을 기준으로 선택했어요. 관계는 직접 판단해 주세요.');return true;}if(d.firstReason){ctx.act({type:'REASON',value:d.firstReason});return true;}const a=d.firstAction;if(!a)return false;if(a==='begin')ctx.begin();else if(a==='leave'||a==='next')ctx.leave(a==='next');else if(a==='work'||a==='review')ctx.act({type:'PHASE',value:a==='work'?'composing':'review'},true);else if(a==='confirm'){ctx.act({type:'CONFIRM'},true);ctx.notice(ctx.state().session.status==='resolved'?'첫 접수를 직접 판단해 마쳤습니다.': '초안과 근거 사이에 다시 확인할 점이 있어요.',ctx.state().session.status!=='resolved');}else if(a==='help'){ctx.sheet('선배 도움 · 답 대신 확인할 기준','관계의 기준을 찾아보세요',ctx.state().hintLevel<1?'<p>지금 적는 관계의 기준 사람이 누구인지 살펴보세요. 이전 기록의 기준 이름과 비교해 보세요.</p>':'<p>이전 기록에서 같은 부모의 자녀로 연결된 두 사람이 있습니다. 그중 한 사람이 새집의 기준이 되면, 다른 사람은 그 기준 사람의 누구인지 생각해 보세요.</p><p>이전 표의 관계 이름을 그대로 복사하지 말고 사람 사이의 연결을 읽어 보세요.</p>');ctx.act({type:'HELP'});}return true;}

<script>
(function(){

  let bridgeSeq=0,lastBridgeRequest=null;
  function publish(saved,requestId){if(!embed)return;if(embed.protocol===2){const seq=++bridgeSeq;lastBridgeRequest={seq,requestId:typeof requestId==='string'?requestId:'movein:'+seq};parent.postMessage({channel:'resident-center',protocol:2,token:embed.token,...lastBridgeRequest,model:saved},'*');}else parent.postMessage({channel:'resident-center',token:embed.token,model:saved},'*');}
  let model=loaded.model,route=model.tutorial?.active?'tutorial':model.active?'work':model.mode==='chapter'?'map':'home',review=null,message=loaded.reason||'자동 저장 준비 완료 · 질문과 도움은 무료입니다.',warning=!loaded.ok,saveTimer=null,conflict=false,protectedRaw=loaded.protectedRaw||'',protectedExported=false,pendingImport=null,lastFocus=null,shownRecord=null,hintLevel=0,audio=null;
  const current=()=>model.active?D.get(model.active.visitId):null,session=()=>model.active?.session;
  function needsFirst(){return !model.tutorial&&Object.keys(model.records).length===0&&Object.keys(model.drafts).length===0&&!model.active;}
  function beginFirst(){model=P.stash(model);model.active=null;model.tutorial=model.tutorial||T.create();model.tutorial.active=true;review=null;navigate('tutorial');}
  function leaveFirst(next=false){model.tutorial.active=false;route=model.mode==='chapter'?'map':'home';saveNow();if(next&&model.tutorial.session.status==='resolved'){const c=P.next(model);if(c){start(c.visitId);return;}}navigate(route);}
  function firstAct(a,reset=false){if(conflict&&a.type==='CONFIRM'){notice('최신 기록을 먼저 불러와 주세요.',true);return false;}const r=T.act(model.tutorial,a);if(!r.accepted){notice(r.reason,true);return false;}model.tutorial=r.state;if(a.type==='PHASE')history.pushState(navState(),'');saveSoon();render(reset);return true;}
  const firstView=window.createTutorialView({$,T,esc,avatar,state:()=>model.tutorial,conflict:()=>conflict,sheet:showSheet,act:firstAct,begin:beginFirst,leave:leaveFirst,notice});
  const personName=(c,id)=>[...c.people,...(c.existing||[])].find(p=>p.id===id)?.name||'미지정';
  function avatar(p){const palettes=[['#493d32','#6c8461'],['#433b35','#af966d'],['#634737','#718e99'],['#514437','#9d7773']],[hair,shirt]=palettes[p?.palette||0];return `<svg viewBox="0 0 16 24" aria-hidden="true" shape-rendering="crispEdges"><path fill="${hair}" d="M5 1h6v1h2v7H3V3h2z"/><path fill="#e5bb97" d="M4 5h8v6h-1v2H5v-2H4z"/><path fill="${hair}" d="M4 3h8v3H9V5H4z"/><path fill="#423d35" d="M5 7h1v1H5zm5 0h1v1h-1z"/><path fill="#c68f79" d="M7 10h2v1H7z"/><path fill="#e5bb97" d="M7 12h2v3H7zM2 16h2v5H2zm10 0h2v5h-2z"/><path fill="${shirt}" d="M5 14h6v1h2v4H3v-4h2zM4 18h8v3H4z"/><path fill="#4a5448" d="M4 21h3v2H4zm5 0h3v2H9z"/><path fill="#353e35" d="M3 23h4v1H3zm6 0h4v1H9z"/></svg>`;}
  function beep(frequency=520){if(!model.settings.sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=frequency;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.start();o.stop(audio.currentTime+.1);}catch(e){}}
  function notice(text,bad=false){message=text;warning=bad;$('live-note').textContent=text;$('live-note').classList.toggle('warning',bad);}
  function saveNow(requestId){clearTimeout(saveTimer);saveTimer=null;const result=store.save(model);if(result.ok){model.saveRevision=result.model.saveRevision;model.savedAt=result.model.savedAt;notice(embed?'본편에 기록 전달 중…':'진행 기록 저장됨 · '+new Date(model.savedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));publish(result.model,requestId);return true;}conflict=!!result.conflict;notice(result.reason,true);return false;}
  function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,200);}
  function navState(){return {route,phase:route==='tutorial'?model.tutorial.session.view.phase:session()?.view.phase||'',visitId:model.active?.visitId||''};}
  function navigate(next,push=true){route=next;if(push)history.pushState(navState(),'');render(true);saveNow();}

  function rememberFocus(){const el=document.activeElement;if(!el||!el.closest('#game'))return null;for(const attr of ['data-first-move','data-first-head','data-first-rel','data-first-source','data-first-reason','data-first-action','data-select','data-head','data-return','data-rel','data-board','data-start','data-doc','data-do','data-phase','data-household','data-disposition','data-followup','id'])if(el.hasAttribute(attr))return [attr,el.getAttribute(attr)];return null;}
  function render(resetScroll=false){if(embed?.kind==='practice'&&model.active)route='work';const focus=rememberFocus(),scroll=$('work-scroll').scrollTop,c=current(),s=session(),inWork=route==='work'&&!!c;
    document.body.classList.toggle('first-contact',route==='tutorial');
    document.body.classList.toggle('no-motion',!model.settings.motion);document.body.classList.toggle('large-text',parseFloat(getComputedStyle(document.documentElement).fontSize)>22);
    $('back').hidden=route==='home';$('header-title').textContent=inWork?c.title:route==='map'?'모퉁이동의 첫 근무':'모퉁이동 주민센터';$('header-subtitle').textContent=inWork?(model.active.practice?'무보상 연습 · 기록에 영향 없음':`접수 ${c.visitId} · ${c.subtitle}`):model.mode==='chapter'?'전입신고 중심 · 4일의 근무':'전입신고 퍼즐 · 여섯 번의 접수';
    $('resident-bar').hidden=!inWork;$('stages').hidden=!inWork;$('tools').hidden=!inWork||s.status==='resolved';
    if(route==='tutorial'&&model.tutorial){firstView.render(model.tutorial);}else if(inWork){const p=c.people.find(p=>p.id===c.resident);$('resident-bar').innerHTML=`<div class="portrait">${avatar(p)}</div><div><b>${p.name}</b><small>성인 · 가상 주민</small><p>${esc(c.speech)}</p></div><button data-do="conversation">대화 보기</button>`;const phase=s.view.phase,stages=[['intake','1 접수'],['moving','2 이동'],['composing','3 구성'],['review','4 검토']];$('stages').innerHTML=stages.map(([id,label])=>`<button class="stage ${phase===id?'active':''}" data-phase="${id}" ${s.status==='resolved'?'disabled':''} ${phase===id?'aria-current="step"':''}>${label}</button>`).join('');$('tools').innerHTML=`<button data-do="documents">▤ 자료철 ${s.knowledge.seenDocumentIds.length}/${c.documents.length}</button><button data-do="questions">? 주민에게 질문</button><button data-do="hint">업무 도움</button><span class="evidence-count">확인 ${s.knowledge.verifiedFactIds.length}/${c.requiredFacts.length}</span>`;
      if(s.status==='resolved')renderResult(c,s.record);else if(phase==='intake')renderIntake(c,s);else if(phase==='review')renderReview(c,s);else renderBoards(c,s);
    }else if(route==='record'&&shownRecord)renderResult(shownRecord.c,shownRecord.record);else if(route==='map')renderMap();else renderHome();
    $('live-note').textContent=message;$('live-note').classList.toggle('warning',warning);$('work-scroll').scrollTop=resetScroll?0:scroll;
    if(focus){const [a,val]=focus,el=Array.from(document.querySelectorAll(a==='id'?'[id]':`[${a}]`)).find(x=>x.getAttribute(a)===val);if(el&&!el.disabled&&el.getClientRects().length)el.focus({preventScroll:true});}

  function renderHome(){const seq=P.sequence(model.mode),done=seq.filter(c=>model.records[model.mode+':'+c.visitId]).length,next=P.next(model);$('work-scroll').innerHTML=`<div class="intro"><div><span class="eyebrow">새로운 근무지 · 전입신고 창구</span><h1>새 주소로<br>옮겨드립니다.</h1><p>누가 이사하고, 누가 남을까요? 주민의 이야기를 듣고 새로운 세대 기록을 만들어 주세요.</p></div><div class="houses" aria-hidden="true">⌂ <span>→</span> ⌂</div></div><div class="mode-switch"><button class="${model.mode==='puzzle'?'active':''}" data-mode="puzzle">퍼즐 여섯 사례</button><button class="${model.mode==='chapter'?'active':''}" data-mode="chapter">4일의 근무 이야기</button></div><div class="section-heading"><h2>오늘 만날 주민들</h2><span>${done} / ${seq.length} 접수</span></div><section class="first-entry"><h2>두 사람의 첫 독립 주소</h2><p>자료를 연결해 관계를 직접 판단하는 첫 접수</p><button data-first-action="begin">${model.tutorial?.session.status==='resolved'?'첫 접수 기록 보기':model.tutorial?'첫 접수 이어하기':'첫 접수부터 배우기 →'}</button></section><div class="case-grid">${seq.map((c,i)=>{const record=model.records[model.mode+':'+c.visitId],available=P.available(model,c.visitId);return `<article class="case-card ${!available?'locked':''}"><span class="case-no">${String(i+1).padStart(2,'0')} · ${c.visitId}</span><h3>${c.title}</h3><p>${c.subtitle}</p>${record?`<span class="done-label">✓ ${record.outcome==='registered'?'전입 처리 완료':'보완 안내 완료'}</span>`:''}<div class="case-actions">${record?`<button data-record="${c.visitId}">기록</button><button data-practice="${c.visitId}">연습</button>`:`<button class="${available?'secondary':''}" data-start="${c.visitId}" ${available?'':'disabled'}>${available?'접수하기':'이전 접수 후'}</button>`}</div></article>`;}).join('')}</div><p class="home-note">가상의 성인과 주소로 만든 게임입니다. 실제 행정 처리를 수행하지 않습니다. 질문과 도움은 무료이며 제한시간은 없습니다.</p>`;actions(button('기념품','shelf'),done===seq.length?'모든 접수를 마쳤습니다.':'작성 중 기록은 자동 저장됩니다.',needsFirst()?'<button class="primary" data-first-action="begin">첫 접수 시작 →</button>':next?`<button class="primary" data-start="${next.visitId}">${model.drafts[model.mode+':'+next.visitId]||model.active?.visitId===next.visitId?'이어서 접수':'첫 미완료 접수'} →</button>`:button('완료 기록 보기','records','primary'));}

  function target(where,source){const c=current();if(where==='documents'){openDoc(source||'report');return;}if(where==='questions'){openQuestions();return;}dispatch({type:'SET_PHASE',value:where==='people'?'moving':'composing'},false);dispatch({type:'SWITCH_BOARD',value:where==='people'?'before':'after'},false);render();const ids={people:'before-board',address:'address-field',mode:'mode-field',head:'head-field',relations:'people-after'};const el=$(ids[where]);if(el){el.scrollIntoView({block:'center',behavior:model.settings.motion?'smooth':'auto'});el.classList.add('flash');el.querySelector('button:not(:disabled),select:not(:disabled)')?.focus({preventScroll:true});}else if(where==='followup'||where==='disposition'){dispatch({type:'SET_PHASE',value:'review'});}}
  function switchMode(mode){if(!['puzzle','chapter'].includes(mode)||mode===model.mode&&route!=='home')return;saveNow();model=P.stash(model);model.active=null;model.mode=mode;review=null;navigate(mode==='chapter'?'map':'home');if(mode==='chapter'&&!model.introduced){model.introduced=true;saveNow();showSheet('인사발령 · 새로운 근무지','모퉁이동 주민센터로 발령',`<p>업무 순환에 따라 모퉁이동 주민센터에서 근무하게 되었습니다. 새 창구의 주 업무는 전입신고입니다.</p><p>선임 정서린이 자리와 자료철을 소개합니다. “주소를 옮기는 일에는 사람의 이야기도 따라와요. 첫 접수부터 같이 살펴봐요.”</p>`,button('새 창구로 출근하기','sheet-close','primary'));}}
  function shelf(){showSheet('첫 근무의 작은 기념','내 기념품',`<div class="shelf">${C.items.map(i=>`<article class="item"><b>${model.items.includes(i.id)?'✓':'○'} ${i.name}</b><small>${model.items.includes(i.id)?i.description:'근무 이야기를 진행하면 만날 수 있어요.'}</small></article>`).join('')}</div><p class="small-note">기념품은 한 번만 지급됩니다. 업무 도움은 무료이고 별도 구매가 필요하지 않습니다.</p>`);}
  function settings(){showSheet('기록 · 환경 설정','나의 근무 기록',`<div class="settings-grid"><p>완료 기록 ${Object.keys(model.records).length}건 · 기념품 ${model.items.length}개</p><button data-do="export">현재 기록 JSON 내보내기</button>${embed?.protocol===2?'':'<button data-do="import">백업 JSON 가져오기</button>'}${protectedRaw?'<button data-do="export-original">읽지 못한 원본 그대로 내보내기</button><button data-do="recover">현재 기록으로 저장 복구</button>':''}${conflict?'<button data-do="reload-latest">다른 창의 최신 기록 불러오기</button>':''}<button data-do="toggle-motion">이동 효과 ${model.settings.motion?'켜짐':'꺼짐'}</button><button data-do="toggle-sound">작은 효과음 ${model.settings.sound?'켜짐':'꺼짐'}</button></div><p class="small-note">브라우저나 file 실행 환경에 따라 저장을 사용할 수 없을 수 있습니다. 백업 파일로 옮길 수 있으며 본편의 기존 저장은 수정하지 않습니다.</p>`);}
  function download(text,name){const blob=new Blob([text],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
  function back(){if($('sheet').open){closeSheet();return;}if(route==='tutorial'){const phase=model.tutorial.session.view.phase;if(phase==='review'){firstAct({type:'PHASE',value:'composing'},true);return;}if(phase==='composing'){firstAct({type:'PHASE',value:'intake'},true);return;}leaveFirst();return;}if(route==='work'&&session()?.status==='editing'){const phase=session().view.phase;if(phase==='review'){dispatch({type:'SET_PHASE',value:'composing'});return;}if(phase==='composing'){dispatch({type:'SET_PHASE',value:'moving'});dispatch({type:'SWITCH_BOARD',value:'before'});return;}if(phase==='moving'){dispatch({type:'SET_PHASE',value:'intake'});return;}}navigate(model.mode==='chapter'?'map':'home');}
  document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;const ds=b.dataset,c=current();
    if(firstView.click(b))return;
    if(ds.start){start(ds.start);return;}if(ds.practice){start(ds.practice,true);return;}if(ds.record){shownRecord={c:D.get(ds.record),record:model.records[model.mode+':'+ds.record]};navigate('record');return;}if(ds.mode){switchMode(ds.mode);return;}if(ds.phase){dispatch({type:'SET_PHASE',value:ds.phase});if(ds.phase==='moving')dispatch({type:'SWITCH_BOARD',value:'before'});$('work-scroll').scrollTop=0;return;}if(ds.board){dispatch({type:'SWITCH_BOARD',value:ds.board});$('work-scroll').scrollTop=0;return;}
    if(ds.select){dispatch({type:'SELECT_PERSON',id:ds.select});beep();return;}if(ds.return){dispatch({type:'RETURN_PERSON',id:ds.return});return;}if(ds.head){dispatch({type:'SET_DESTINATION_HEAD',id:ds.head});return;}if(ds.rel){openRelation(ds.rel);return;}if(ds.relation){dispatch({type:'SET_RELATION',id:ds.relation,value:ds.value});closeSheet();return;}if(ds.household){dispatch({type:'SET_HOUSEHOLD_MODE',value:ds.household});return;}if(ds.disposition){dispatch({type:'SET_DISPOSITION',value:ds.disposition},false);dispatch({type:'SET_PHASE',value:'review'});return;}if(ds.followup){dispatch({type:'SET_FOLLOWUP_REASON',id:ds.followup},false);dispatch({type:'SET_PHASE',value:'review'});return;}
    if(ds.doc){openDoc(ds.doc);return;}if(ds.verify){dispatch({type:'VERIFY_EVIDENCE',id:ds.verify});closeSheet();return;}if(ds.question){dispatch({type:'ASK_QUESTION',id:ds.question});openQuestions();return;}if(ds.target){target(ds.target,ds.source);return;}if(ds.zone){const z=C.zones.find(z=>z.id===ds.zone),path=C.path(model.map,z.approach);if(!path){notice('이 위치로 이동할 수 없습니다.',true);return;}model.map={...z.approach};saveNow();render();if(z.id==='counter'){const day=P.currentDay(model),next=P.next(model);if(day&&next&&day.visits.includes(next.visitId))start(next.visitId);else notice('오늘의 접수를 마쳤습니다. 퇴근 결산을 눌러 주세요.');}else if(z.id==='desk')showSheet('직원 책상 · 선임 정서린','관계의 기준을 확인하세요','<p>“이전 기록과 새 기록에서 관계의 기준이 누구인지 비교해 보세요. 옮기는 사람과 남는 사람을 따로 생각해 보세요.”</p>');else if(z.id==='forms')showSheet('서식대','전입신고 업무 안내','<p>이전 집, 이동할 사람, 새 주소, 전입지 세대주와 관계를 차례로 확인합니다. 자료가 부족하면 필요한 내용을 안내하고 기록을 변경하지 않습니다.</p>');else if(z.id==='files')shelf();else notice(z.name+'로 이동했습니다. 전입 창구에서 접수를 시작할 수 있습니다.');return;}
    const action=ds.do;
    if(b.id==='back'){back();return;}if(b.id==='sheet-close'||action==='sheet-close'){closeSheet();return;}
    if(action==='compose-start'){dispatch({type:'SET_PHASE',value:'moving'});dispatch({type:'SWITCH_BOARD',value:'before'});}
    else if(action==='move'){dispatch({type:'MOVE_SELECTED'});$('work-scroll').scrollTop=0;beep();}
    else if(action==='review'){dispatch({type:'SET_PHASE',value:'review'});$('work-scroll').scrollTop=0;}
    else if(action==='edit'){dispatch({type:'SET_PHASE',value:'composing'});}
    else if(action==='undo'||action==='redo'){dispatch({type:action.toUpperCase()});}
    else if(action==='confirm')confirm();
    else if(action==='leave')navigate(model.mode==='chapter'?'map':'home');
    else if(action==='next'){if(model.mode==='chapter')navigate('map');else{const next=P.next(model);if(next)start(next.visitId);else navigate('home');}}
    else if(action==='documents')showSheet('자료철 · 제시된 가상 자료','신고 내용과 확인 상태',`<div class="document-grid">${docsList(c,session())}</div>`);
    else if(action==='questions')openQuestions();
    else if(action==='conversation')showSheet('오늘의 주민 · '+personName(c,c.resident),'주민의 이야기',`<p>“${esc(c.speech)}”</p>${knownMemo(c,session())}`);
    else if(action==='hint'){hintLevel=0;hint();}else if(action==='hint-next'){hintLevel=Math.min(2,hintLevel+1);hint();}
    else if(action==='settings')settings();else if(action==='shelf')shelf();else if(action==='records')navigate('home');
    else if(action==='counter'){const day=P.currentDay(model),next=P.next(model);if(next&&day?.visits.includes(next.visitId))start(next.visitId);}
    else if(action==='close-day'){const r=P.closeDay(model);if(r.accepted){model=r.model;saveNow();render(true);showSheet('근무 '+r.day.day+'일차 결산',r.day.day===4?'첫 근무를 마쳤습니다.':'오늘도 수고했습니다.',`<p>${esc(r.day.closing)}</p><p class="small-note">오늘의 접수와 기념품 지급이 기록되었습니다.</p>`,button(r.day.day===4?'기념품과 기록으로':'다음 날 출근하기','sheet-close','primary'));}else notice(r.reason,true);}
    else if(action==='export'){download(JSON.stringify(S.pack(model),null,2),'모퉁이동_근무기록.json');notice('현재 기록 백업을 내보냈습니다.');}
    else if(action==='export-original'){download(protectedRaw,'모퉁이동_원본기록.json');protectedExported=true;notice('읽지 못한 원본 백업을 내보냈습니다.');}
    else if(action==='import')$('import-file').click();
    else if(action==='apply-import'&&pendingImport){const r=store.recover(pendingImport);if(r.ok){model=r.model;publish(r.model);pendingImport=null;conflict=false;protectedRaw='';closeSheet();route=model.tutorial?.active?'tutorial':model.active?'work':model.mode==='chapter'?'map':'home';review=null;notice('백업 기록을 가져왔습니다.');render(true);}else notice(r.reason,true);}
    else if(action==='recover'){if(!protectedExported){notice('먼저 읽지 못한 원본을 그대로 내보내 보관해 주세요.',true);return;}showSheet('저장 복구','현재 기록으로 저장 공간 복구',`<p>원본 백업을 보관한 뒤 현재 플레이 기록 ${Object.keys(model.records).length}건으로 이 주민센터의 저장 공간을 교체합니다.</p>`,button('취소','sheet-close')+button('현재 기록으로 복구','apply-recover','primary'));}
    else if(action==='apply-recover'){const r=store.recover(model);if(r.ok){model.saveRevision=r.model.saveRevision;model.savedAt=r.model.savedAt;protectedRaw='';protectedExported=false;conflict=false;publish(r.model);closeSheet();notice('저장 공간을 복구했습니다.');render();}else notice(r.reason,true);}
    else if(action==='reload-latest'){download(JSON.stringify(S.pack(model),null,2),'모퉁이동_불러오기전_초안.json');const r=store.load();if(r.ok){model=r.model;conflict=false;review=null;closeSheet();route=model.tutorial?.active?'tutorial':model.active?'work':model.mode==='chapter'?'map':'home';notice('현재 초안을 백업하고 최신 기록을 불러왔습니다.');render(true);}else notice(r.reason,true);}
    else if(action==='toggle-motion'||action==='toggle-sound'){const key=action==='toggle-motion'?'motion':'sound';model.settings[key]=!model.settings[key];saveNow();render();settings();if(key==='sound')beep();}
  });
  document.addEventListener('change',async event=>{if(event.target.dataset.firstRel){firstAct({type:'RELATION',id:event.target.dataset.firstRel,value:event.target.value});return;}if(event.target.id==='address-select')dispatch({type:'SET_ADDRESS',value:event.target.value});if(event.target.id==='import-file'){const file=event.target.files[0];event.target.value='';if(!file)return;if(file.size>S.LIMIT){notice('백업 파일이 너무 큽니다.',true);return;}const parsed=S.parse(await file.text());if(!parsed.valid){notice(parsed.reason,true);return;}pendingImport=parsed.model;showSheet('백업 가져오기 · 적용 전 확인','이 기록으로 바꿀까요?',`<p>현재 기록 ${Object.keys(model.records).length}건 → 가져올 기록 ${Object.keys(pendingImport.records).length}건</p><p>진행 중 초안과 기념품도 백업 내용으로 바뀝니다. 필요하면 먼저 현재 기록을 내보내 보관하세요.</p>`,button('현재 기록 내보내기','export')+button('백업 적용','apply-import','primary'));}});
  $('sheet').addEventListener('cancel',e=>{e.preventDefault();closeSheet();});
  window.addEventListener('popstate',event=>{if($('sheet').open){closeSheet();history.pushState(navState(),'');return;}const nav=event.state;if(!nav){back();return;}route=nav.route||'home';if(route==='tutorial'){if(!model.tutorial){route='home';}else{model.tutorial.active=true;if(model.tutorial.session.status==='editing'&&['intake','composing','review'].includes(nav.phase)){const r=T.act(model.tutorial,{type:'PHASE',value:nav.phase});if(r.accepted)model.tutorial=r.state;}}}else if(model.tutorial)model.tutorial.active=false;if(route==='work'&&nav.visitId!==model.active?.visitId)route=model.mode==='chapter'?'map':'home';if(route==='work'&&session()?.status==='editing'&&nav.phase){const r=E.dispatch(current(),session(),{type:'SET_PHASE',value:nav.phase});if(r.accepted)model.active.session=r.session;}render(true);saveNow();});
  window.addEventListener('storage',event=>{if(event.key===S.KEY){conflict=true;notice('다른 창에서 기록이 변경되었습니다. 설정에서 최신 기록을 불러와 주세요.',true);render();}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();});window.addEventListener('pagehide',saveNow);
  let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>render(),100);});
  window.addEventListener('message',event=>{const msg=event.data;if(!embed||event.source!==parent||!msg||msg.token!==embed.token)return;if(msg.channel==='resident-center-flush'){if(embed.protocol!==2||msg.protocol===2)saveNow(msg.requestId);}else if(msg.channel==='resident-center-ack'&&(embed.protocol!==2||msg.protocol===2&&msg.requestId===lastBridgeRequest?.requestId&&msg.seq===lastBridgeRequest?.seq))notice(msg.ok?(msg.memory?'체험 기록 유지 중 · 종료 전 백업 필요':embed.protocol===2?'주민센터에 진행 기록 저장됨':embed.kind==='preview'?'체험 기록 유지 중 · 성장 보상 없음':'본편에 진행 기록 저장됨'):msg.reason||'본편 저장을 확인하지 못했습니다. 백업을 내보내 주세요.',!msg.ok);});
  history.replaceState(navState(),'');render(true);
  if(embed&&model.mode==='chapter'&&!model.introduced){model.introduced=true;saveNow();showSheet('인사발령 · 새로운 근무지','모퉁이동 주민센터로 발령','<p>선임 정서린이 자리와 자료철을 소개합니다. “주소를 옮기는 일에는 사람의 이야기도 따라와요. 첫 접수부터 같이 살펴봐요.”</p>',button('새 창구로 출근하기','sheet-close','primary'));}
})();

</script>
