<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>첫 접수 재설계 · 계획 검토용</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5e9df;color:#263e33;font:16px/1.6 "Malgun Gothic","맑은 고딕",system-ui,sans-serif}button,select,input{font:inherit}button,select{min-height:44px}button{border:1px solid #c7d0bf;border-radius:9px;background:#fffdf6;color:inherit;cursor:pointer;padding:7px 12px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b48136;outline-offset:2px}button:disabled{opacity:.45;cursor:default}header.controls{max-width:1250px;padding:16px 20px;margin:auto}h1{font-size:23px;margin:0}p{margin:5px 0}.controls small{display:block;color:#5e705e}.controls .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}select{max-width:230px;padding:5px}input{width:80px;min-height:44px}.compare{display:flex;gap:30px;padding:0 20px 30px;overflow:auto;align-items:flex-start}.compare article{flex:none}h2{font-size:16px;margin:4px 0}article>small{display:block;font-size:12px;color:#60715c;margin-bottom:8px}.old-image{display:block;width:390px;height:844px;object-fit:contain;object-position:top;background:#faf8ef;border:1px solid #b6c3ac}.phone{width:390px;height:844px;background:#faf8ef;border:1px solid #b6c3ac;display:flex;flex-direction:column;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#244b39;color:#fff9e8;min-height:54px;flex:none}.top b{font-size:15px}.top small{font-size:11px}.scene{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid #d9decd;background:#f0e9d9;flex:none}.portrait{width:43px;height:52px;display:grid;place-items:center;border:1px solid #c7c8b1;background:#e7e5ce;border-radius:6px;flex:none}.portrait svg{width:27px;height:40px;image-rendering:pixelated}.scene b{font-size:13px}.scene p{font-size:14px;line-height:1.6}.goal{padding:9px 15px;background:#e6eddd;flex:none;font-size:14px}.goal small{display:block;font-size:11px;color:#66765a}.workspace{padding:13px 15px;overflow:auto;flex:1;min-height:0}.house{border:2px solid #b4baa0;border-radius:12px;padding:10px;background:#f4efdf;margin-bottom:13px;position:relative}.house.new{background:#eaf0e1;border-color:#8da37a}.house-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}.house-title small{font-size:11px;color:#64705a}.address{font-size:11px;color:#6f705c;margin:2px 0 8px}.people{display:flex;gap:7px;min-height:100px;align-items:stretch}.person{padding:7px 4px;flex:1;max-width:104px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;background:#fffdf5}.person svg{width:24px;height:36px;image-rendering:pixelated}.person small{font-size:10px;line-height:1.5;color:#65725c}.person.anchor{border:2px solid #315b43;background:#dce9d0}.empty{font-size:13px;color:#6b775f;display:grid;place-items:center;flex:1;border:1px dashed #b6c3a9;border-radius:7px;min-height:100px}.legend{font-size:12px;color:#69765f;line-height:1.7}.relation{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.relation button{font-size:13px;flex:1}.paper{background:#fffdf5;border:1px solid #c4c9b7;padding:13px;border-radius:8px}.paper h3{font-size:16px;margin:0 0 10px}.paper dl{font-size:13px;margin:0;display:grid;grid-template-columns:76px 1fr;gap:10px}.paper dt{color:#69765d}.paper dd{margin:0;border-bottom:1px solid #e0e3d4;padding-bottom:5px}.paper .link{font-size:11px;color:#667d5c;margin-top:10px}.result{padding:18px 8px;text-align:center}.result>svg{width:40px;height:60px;image-rendering:pixelated}.result h3{font-size:22px}.result p{font-size:14px}.live{min-height:39px;flex:none;background:#eef1e5;padding:7px 14px;font-size:12px}.live.bad{background:#f4e4d4;color:#8b4231}.footer{padding:9px 13px;display:flex;gap:7px;border-top:1px solid #d0d7c2;flex:none}.footer .main{flex:1;background:#315b43;color:#fffdf1;font-size:14px}.footer .secondary{font-size:12px}.measure{font:13px/1.7 monospace}.hint{font-size:12px;color:#68745c}#evidence{margin-top:8px}.decision-summary{margin-top:8px;border-left:3px solid #8ba575;padding:7px 10px;font-size:13px;background:#edf1e4}
</style></head><body><header class="controls"><h1>첫 접수 · 가족의 이사를 함께 기록하기</h1><small>계획 검토용 시안입니다. 기존 게임·저장·보상에 연결되지 않습니다. 단계 선택은 예시 상태를 불러옵니다.</small><div class="row"><label>폭 <input id="width" type="number" min="320" max="900" value="390"></label><label>높이 <input id="height" type="number" min="480" max="1000" value="844"></label><button id="size">치수 적용</button><select id="preset" aria-label="화면 크기"><option value="390,844">390 × 844</option><option value="320,568">320 × 568</option><option value="430,932">430 × 932</option></select><select id="stage" aria-label="검토할 장면"><option value="0">1 주민의 이야기</option><option value="1" selected>2 이사하는 사람 배치</option><option value="2">3 남는 집·새집 확인</option><option value="3">4 새집의 대표 정하기</option><option value="4">5 관계의 기준 배우기</option><option value="5">6 집 → 신고서 연결</option><option value="6">7 주민에게 결과 전달</option></select><button id="reset">처음부터</button></div><p class="measure" id="measure"></p><p class="hint">기존과 같은 맑은 고딕 기본 16px. 시안 대화·목표 14px, 본 행동 최소 44px. 아래 게임 영역만 선택한 뷰포트 크기입니다. 수치는 제안값이며 사용자 승인값은 아직 없습니다.</p></header><main class="compare"><article><h2>현재 · 업무를 알아야 읽히는 화면</h2><small>현행 구현 M03 이동 화면의 390×844 캡처</small><img class="old-image" src="../docs/검증화면/UI_현재_390.png" alt="현재 게임의 세대 이동 화면"></article><article><h2>제안 · 생활 상황 → 선택 → 기록</h2><small>한 장면에서 이전 집과 새집을 함께 확인</small><section class="phone" id="phone"><div class="top"><b>모퉁이동 주민센터</b><small id="progress"></small></div><div class="scene"><div class="portrait" id="portrait"></div><div><b id="speaker"></b><p id="speech"></p></div></div><div class="goal"><b id="goal"></b><small id="subgoal"></small></div><div class="workspace" id="workspace"></div><div class="live" id="live" role="status" aria-live="polite"></div><div class="footer"><button class="secondary" id="previous">한 장면 전</button><button class="secondary" id="help">선배 도움</button><button class="main" id="next"></button></div></section></article></main><script>
const $=id=>document.getElementById(id),names={mom:'김채림',ga:'이가온',bo:'이보람'},shirt={mom:'#aa8071',ga:'#66805b',bo:'#738e9d'};let step=1,moved=[],anchor=null,relation=null;
function avatar(id){return `<svg viewBox="0 0 16 24" aria-hidden="true" shape-rendering="crispEdges"><path fill="#514437" d="M5 1h6v1h2v7H3V3h2z"/><path fill="#e5bb97" d="M4 5h8v6h-1v2H5v-2H4z"/><path fill="#514437" d="M4 3h8v3H9V5H4z"/><path fill="#423d35" d="M5 7h1v1H5zm5 0h1v1h-1z"/><path fill="${shirt[id]||'#66805b'}" d="M5 14h6v1h2v6H3v-6h2z"/><path fill="#4a5448" d="M4 21h3v3H4zm5 0h3v3H9z"/></svg>`;}
const scenes=[['이가온 · 오늘 이사 온 주민','동생 보람이랑 둘이 독립했어요. 어머니는 원래 집에 계세요.','오늘 이사를 한 사람들의 주소를 기록해 주세요.','먼저 주민의 이야기를 듣습니다.','이사 상황 살펴보기'],['정서린 · 함께 일하는 선배','이사는 이미 끝났어요. 우리는 이사한 사람의 주소를 바꿔 기록해요. 집 그림에서 먼저 정리해 볼까요?','주소를 바꿀 사람을 새집에 놓아 주세요.','다시 누르면 원래 집으로 돌려놓을 수 있어요.','이 배치로 확인하기'],['정서린 · 함께 일하는 선배','남은 집도 살펴봐요. 어머니의 주소는 그대로고, 남매의 주소만 바뀌는 거예요.','어머니 1명은 남고, 남매 2명은 옮깁니다.','지금은 기록 초안입니다. 실제 처리는 마지막에 확정해요.','새집의 대표 정하기'],['이가온 · 오늘 이사 온 주민','새집은 제 이름을 대표로 해서 기록해 주세요. 동생이랑 함께 살 거예요.','새집 사람 중 가온을 대표로 표시해 주세요.','행정 기록에서는 이 대표를 ‘세대주’라고 불러요.','대표를 기준으로 관계 보기'],['정서린 · 함께 일하는 선배','예전에는 어머니의 자녀 둘이었죠. 새집은 가온을 기준으로 적어요. 보람은 가온의 누구인가요?','보람과 가온의 관계를 선택해 주세요.','같은 사람이어도 누구를 기준으로 적는지에 따라 표현이 달라져요.','신고서에 연결하기'],['정서린 · 함께 일하는 선배','방금 집 그림에서 정리한 내용이 신고서의 항목이 됩니다. 그림과 기록이 같은지 확인해요.','사람 배치와 신고서가 연결되었습니다.','새 주소는 주민이 제시한 내용으로 확인한 예시입니다.','주민에게 결과 보여 주기'],['이가온 · 처리 결과를 들은 주민','어머니 주소는 그대로고, 저희 둘만 새집으로 옮겨졌네요. 이제 독립한 게 실감 나요.','첫 접수를 함께 마쳤습니다.','계획용 예시이며 실제 게임의 완료 기록은 만들지 않아요.','처음부터 다시 보기']];
function card(id,isNew){let detail=id==='mom'?'어머니':id==='ga'?'보람의 오빠':'가온의 동생';if(step>=4)detail=isNew?(id===anchor?'새집 대표':relation||'대표와의 관계?'):'남는 집의 대표';return `<button class="person ${id===anchor?'anchor':''}" data-person="${id}" aria-label="${names[id]} ${isNew?'새집':'이전 집'}" ${(![1,3].includes(step)||step===3&&!isNew)?'disabled':''}>${avatar(id)}<b>${names[id]}</b><small>${detail}</small>${step===1?`<small>${isNew?'← 돌려놓기':'새집으로 →'}</small>`:''}</button>`;}
function house(isNew){const ids=['mom','ga','bo'].filter(id=>isNew?moved.includes(id):!moved.includes(id));return `<section class="house ${isNew?'new':''}"><div class="house-title"><b>${isNew?'새집':'이전 집'}</b><small>${ids.length}명 ${isNew?'기록 예정':'남음'}</small></div><div class="address">${isNew?'모퉁이로 12 · 202호':'나무길 8 · 101호'}${step>=4?` · ${isNew?'가온':'채림'}을 기준으로`:''}</div><div class="people">${ids.map(id=>card(id,isNew)).join('')||'<div class="empty">이사할 사람을 여기에 놓아요.</div>'}</div></section>`;}
function notice(t,bad=false){$('live').textContent=t;$('live').className='live'+(bad?' bad':'');}
function render(){const scene=scenes[step];$('stage').value=step;$('progress').textContent='첫 접수 · '+(step+1)+' / 7';$('portrait').innerHTML=avatar(step===0||step===3||step===6?'ga':'bo');$('speaker').textContent=scene[0];$('speech').textContent=scene[1];$('goal').textContent=scene[2];$('subgoal').textContent=scene[3];$('next').textContent=scene[4];$('previous').disabled=step===0;$('workspace').innerHTML=step===5?`<div class="paper"><h3>전입신고 기록 · 미확정</h3><dl><dt>옮기는 사람</dt><dd>이가온 · 이보람</dd><dt>남는 사람</dt><dd>김채림 · 기존 주소 유지</dd><dt>새 주소</dt><dd>모퉁이로 12 · 202호</dd><dt>세대주</dt><dd>이가온 · 새집의 대표</dd><dt>관계</dt><dd>가온: 본인 / 보람: 형제자매</dd></dl><p class="link">집에 놓은 사람 → 옮기는 사람<br>새집 대표 → 세대주<br>대표와의 관계 → 세대주와의 관계</p></div><div class="decision-summary">이전 집 1명 유지 → 새집 2명 기록<br>아직 최종 처리 전입니다.</div>`:step===6?`<div class="result">${avatar('ga')}<h3>두 사람의 첫 독립 주소</h3><p>김채림은 이전 집에 남았습니다.<br>이가온·이보람의 새 주소가 기록되었습니다.</p><div class="decision-summary">이사한 사람 · 남은 사람 · 새집의 대표<br>세 가지를 상황에서 확인했습니다.</div></div>`:house(false)+house(true)+(step===4?'<div class="relation"><button data-relation="자녀">자녀</button><button data-relation="형제자매">형제자매</button><button data-relation="부모">부모</button></div>':'')+`<p class="legend">${step===1?'사람을 한 번 눌러 옮겨 보고, 다시 눌러 되돌릴 수 있어요.':step===3?'‘세대주’는 이 게임에서 새집의 관계를 적을 때 기준이 되는 사람입니다.':'이전 집과 새집의 기록을 함께 살펴봅니다.'}</p>`;notice(step===1?'누구를 옮길지 정하는 것이 오늘의 첫 판단입니다.':'한 번에 하나의 판단만 진행합니다.');$('workspace').scrollTop=0;}
document.addEventListener('click',e=>{const person=e.target.closest('[data-person]');if(person){const id=person.dataset.person;if(step===1){moved=moved.includes(id)?moved.filter(x=>x!==id):[...moved,id];anchor=null;relation=null;render();notice(names[id]+(moved.includes(id)?'을 새집 기록에 넣었어요. 아직 초안입니다.':'을 이전 집에 돌려놓았어요.'));}else if(step===3&&moved.includes(id)){if(anchor!==id)relation=null;anchor=id;render();notice(names[id]+'을 새집 대표로 표시했어요.');}}const rel=e.target.closest('[data-relation]');if(rel){relation=rel.dataset.relation;render();notice(relation==='형제자매'?'맞아요. 보람은 가온의 동생이라 형제자매로 적어요.':'보람은 어머니의 자녀지만, 지금은 가온을 기준으로 보고 있어요.',relation!=='형제자매');}});
$('next').onclick=()=>{if(step===1&&(moved.length!==2||!moved.includes('ga')||!moved.includes('bo'))){notice(moved.includes('mom')?'가온은 “어머니는 원래 집에 계세요”라고 했어요. 남는 사람을 다시 살펴볼까요?':'가온과 동생 보람이 함께 독립했어요. 두 사람의 위치를 살펴볼까요?',true);return;}if(step===3&&anchor!=='ga'){notice('주민이 누구를 대표로 부탁했는지 대화를 다시 살펴봐요.',true);return;}if(step===4&&relation!=='형제자매'){notice('보람과 가온은 남매예요. ‘가온의 누구인가’를 기준으로 골라 주세요.',true);return;}if(step===6){step=0;moved=[];anchor=null;relation=null;}else step++;render();};$('previous').onclick=()=>{step=Math.max(0,step-1);render();};$('help').onclick=()=>notice(step===1?'주민의 말: “동생 보람이랑 둘이 독립했어요. 어머니는 원래 집에 계세요.”':step===4?'기준 사람을 가온으로 바꿔 읽어 보세요. 보람은 가온의 동생입니다.':'위의 대화와 집 그림을 함께 확인해 보세요. 질문과 도움에 감점은 없습니다.');$('stage').onchange=e=>{step=Number(e.target.value);moved=step>=2?['ga','bo']:[];anchor=step>=4?'ga':null;relation=step>=5?'형제자매':null;render();};$('reset').onclick=()=>{step=0;moved=[];anchor=null;relation=null;render();};function size(){const w=Math.max(320,Math.min(900,Number($('width').value)||390)),h=Math.max(480,Math.min(1000,Number($('height').value)||844));$('width').value=w;$('height').value=h;$('phone').style.width=w+'px';$('phone').style.height=h+'px';$('measure').textContent='제안 화면 '+w+' × '+h+'px · 비율 '+(w/h).toFixed(3)+' · 기본 글자 16px · 대화 14px · 표시 배율 100%';}$('size').onclick=size;$('preset').onchange=e=>{[$('width').value,$('height').value]=e.target.value.split(',');size();};render();size();
</script></body></html>
