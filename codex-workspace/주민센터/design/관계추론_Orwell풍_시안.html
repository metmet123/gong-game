}
function graphPanel(){
 const person=byId(state.selected),moved=state.movers.includes(person.id),other=state.movers.find(id=>id!==state.head),head=byId(state.head);
 return `<section class="panel board ${state.tab!=='graph'&&!(width>=800&&state.tab==='source')?'hidden':''}" id="graph-panel" role="tabpanel" aria-label="사람과 관계"><div class="panel-heading"><div><h2>사람과 기록을 연결하세요</h2><p>인물을 누르고, 새 주소 기록에 배치하세요.</p></div><span class="tag">DRAFT</span></div><div class="legend"><span><i></i>자료에 있는 관계</span><span><i class="draft"></i>내가 정하는 관계</span></div>
 <div class="houses"><section class="house"><div class="house-title"><strong>이전 주소 기록</strong><small>나무길 8 · 101호</small></div><div class="graph"><svg class="wires" viewBox="0 0 350 203" preserveAspectRatio="none" aria-hidden="true"><path d="M175 82 V99 H87 V118 M175 99 H263 V118"/><text x="78" y="106">자녀</text><text x="254" y="106">자녀</text></svg>${people.map(p=>`<button class="node ${p.id==='chae'?'mom':p.id} ${state.selected===p.id?'selected':''} ${state.movers.includes(p.id)?'moved':''}" data-person="${p.id}" aria-pressed="${state.selected===p.id}" aria-label="${p.name} 선택, ${p.role}">${portrait(p.id)}<b>${p.name}</b>${p.id==='chae'?'<small>기준</small>':''}</button>`).join('')}</div></section>
 <div class="transition" aria-hidden="true">주소 이동 ↓</div><section class="house new-house"><div class="house-title"><strong>새 주소 기록</strong><small>모퉁이로 12 · 202호</small></div><div class="new-residents">${state.movers.length?state.movers.map(id=>`<button class="resident ${state.selected===id?'selected':''}" data-person="${id}" aria-label="새집 ${byId(id).name} 선택" aria-pressed="${state.selected===id}">${portrait(id)}<span><strong>${byId(id).name}</strong><small>${state.head===id?'기준 · 본인':'관계 작성 전'}</small></span></button>`).join(''):'<div class="empty">이전 기록의 인물을 선택한 뒤<br>‘새집에 배치’를 눌러 주세요.</div>'}</div><div class="pending-line">${head?`${head.name} ↔ ${other?byId(other).name:'함께 사는 사람'} · ${state.relation?escape(state.relation)+' (내 판단)':'관계 미정'}`:'새집에서 누구를 기준으로 기록할까요?'}</div></section></div>
 <section class="inspect" aria-label="선택 인물 편집"><div class="inspect-title"><strong>${person.name} <span style="color:#8ea7b0;font-weight:400">/ 선택 인물</span></strong><small>내 초안</small></div><div class="actionrow"><button data-action="move" class="${moved?'on':''}">${moved?'← 이전 집으로':'새집에 배치 →'}</button><button data-action="head" ${!moved?'disabled':''} class="${state.head===person.id?'on':''}">${state.head===person.id?'기준으로 선택됨':'기준으로 지정'}</button></div>
 ${head&&other?`<label for="relation">${byId(other).name}은 ${head.name}의 누구인가요?</label><select id="relation" aria-label="새집 관계 선택"><option value="">관계를 직접 정해 주세요</option>${['형제자매','자녀','부모','배우자','동거인'].map(r=>`<option ${state.relation===r?'selected':''}>${r}</option>`).join('')}</select><p class="hint">기준 사람을 바꾸면 관계도 다시 판단해야 합니다.</p>`:'<p class="hint">새집에 사람을 배치하고 기준을 지정하면 관계를 기록할 수 있어요.</p>'}</section>
 <button class="mobile-clue" data-action="source"><em>SOURCE / 주민의 말</em>“어머니는 나무길 집에 그대로 계세요.”<br><span style="color:#8fbdc8">자료 다시 읽기 ↗</span></button></section>`;
}
function sourcePanel(){
 const parts={story:['방문 주민의 진술','이사한 사람은 누구일까?',['보람이랑 저는 이번에 새집으로 이사를 마쳤어요.','어머니는 나무길 집에 그대로 계세요.']],request:['새집 기록 요청','새로운 기준을 정하는 말',['새집에서는 제 이름, 이가온을 기준으로 함께 사는 사람을 적어 주세요.']]};
 let body;
 if(state.source==='ledger')body='<div class="document-label">REGISTER / BEFORE MOVING</div><h3>이전 주소 기록</h3><div class="ledger"><div class="ledger-row"><b>기준 사람</b><span>김채림 · 본인</span></div><div class="ledger-row"><b>이가온</b><span>김채림의 자녀</span></div><div class="ledger-row"><b>이보람</b><span>김채림의 자녀</span></div></div><p class="ledger-foot">주소: 나무길 8 · 101호<br>이 기록의 관계는 김채림을 기준으로 적혀 있습니다.</p><button class="mobile-clue" style="display:block" data-pin="이전 기록: 이가온과 이보람은 각각 김채림의 자녀">이전 관계를 근거로 보관 +</button>';
 else {const p=parts[state.source];body=`<div class="document-label">${state.source==='story'?'STATEMENT / 01':'REQUEST / 03'}</div><h3>${p[1]}</h3><div class="speaker">${portrait('ga')}<div>이가온<small>${p[0]} · 접수 창구</small></div></div><blockquote>${p[2].map(t=>`<button class="evidence ${state.pins.includes(t)?'pinned':''}" data-pin="${t}" aria-pressed="${state.pins.includes(t)}">“${t}”</button>`).join('')}</blockquote><p class="caption">판단에 사용할 문장을 누르면 근거로 보관합니다.<br>근거를 모아도 정답은 자동으로 입력되지 않습니다.</p>`;}
 return `<section class="panel source ${state.tab!=='source'?'hidden':''}" id="source-panel" role="tabpanel" aria-label="접수 자료"><div class="panel-heading"><div><h2>접수 자료</h2><p>말과 기록을 비교하며 읽어 보세요.</p></div><span class="tag">SOURCE</span></div><div class="source-tabs" aria-label="자료 종류">${Object.entries(sourceNames).map(([id,name])=>`<button data-source="${id}" class="${state.source===id?'active':''}" aria-pressed="${state.source===id}">${name}</button>`).join('')}</div>${body}<aside class="pinlog"><strong>보관한 근거 / ${String(state.pins.length).padStart(2,'0')}</strong><p>${state.pins.length?state.pins.map(escape).join('<br>'):'아직 보관한 문장이 없습니다.'}</p></aside></section>`;
}
function reviewPanel(){
 const head=byId(state.head);
 return `<section class="panel review ${state.tab!=='review'?'hidden':''}" id="review-panel" role="tabpanel" aria-label="내 신고 초안"><div class="eyebrow">APPLICATION / YOUR DRAFT</div><h2>내 판단을 기록으로</h2><p class="sub">작성한 내용과 그 판단의 이유를 확인하세요.</p><section class="draft-card"><div class="docid">RESIDENT TRANSFER / RC—001</div><dl><dt>이전 주소 → 새 주소</dt><dd>나무길 8 · 101호<br>→ 모퉁이로 12 · 202호</dd><dt>새집 기준 사람</dt><dd>${head?head.name:'아직 지정하지 않았습니다'}</dd><dt>내가 배치한 사람과 관계</dt><dd>${state.movers.length?state.movers.map(id=>`<div class="personrecord"><span>${byId(id).name}</span><span>${state.head===id?'본인':escape(state.relation||'미정')}</span></div>`).join(''):'아직 배치하지 않았습니다'}</dd></dl></section><section class="reason"><h3>이렇게 판단한 이유는 무엇인가요?</h3>${[['new','새집의 기준 사람을 중심으로, 이전 기록과 주민의 말을 함께 읽었다.'],['copy','이전 주소 기록에 적힌 관계를 그대로 옮겼다.'],['order','기록에 먼저 등장하는 사람을 기준으로 삼았다.']].map(([id,t])=>`<button data-reason="${id}" class="${state.reason===id?'on':''}" aria-pressed="${state.reason===id}" ${state.complete?'disabled':''}>${t}</button>`).join('')}</section>${state.feedback?`<div class="feedback ${state.complete?'success':''}" role="status">${state.feedback}</div>`:''}<button class="mobile-clue" style="display:block" data-action="back">← 관계망으로 돌아가서 수정</button></section>`;
}
function toast(text){clearTimeout(toastTimer);app.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=text;app.appendChild(el);toastTimer=setTimeout(()=>el.remove(),2600);}
function invalidate(){state.relation='';state.reason='';state.feedback='';state.complete=false;}
function submit(){
 if(state.movers.length!==2||!state.movers.includes('ga')||!state.movers.includes('bo'))state.feedback='이사한 사람에 대한 판단을 다시 확인해 보세요. ‘주민의 말’을 읽고 배치한 사람과 비교해 보세요.';
 else if(state.head!=='ga')state.feedback='새집의 기준을 정한 근거를 다시 확인해 보세요. ‘새집 기록 요청’에 적힌 말과 내 초안을 비교해 보세요.';
 else if(state.relation!=='형제자매')state.feedback='관계를 정한 근거를 다시 확인해 보세요. ‘이전 주소 기록’의 관계와 지금 선택한 기준을 함께 비교해 보세요.';
 else if(state.reason!=='new')state.feedback='관계를 작성할 때 무엇을 기준으로 삼았는지 판단 이유를 선택해 주세요.';
 else {state.complete=true;state.feedback='접수 완료. 같은 사람도 기준이 달라지면 기록되는 관계가 달라집니다. 김채림의 자녀인 두 사람은 이가온을 기준으로 본인과 형제자매로 기록됩니다.';}
 draw();app.querySelector('.feedback')?.scrollIntoView({block:'nearest'});
}
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 const scroll=app.querySelector('.board')?.scrollTop||0;
 if(b.dataset.person){state.selected=b.dataset.person;draw();app.querySelector('.board').scrollTop=scroll;if(width<800){app.querySelector(".inspect").scrollIntoView({block:"nearest",behavior:"instant"});app.querySelector("[data-action=move]").focus({preventScroll:true});}else app.querySelector(`[data-person="${state.selected}"]`)?.focus({preventScroll:true});return;}
 if(b.dataset.tab){state.tab=b.dataset.tab;draw();app.querySelector(`[data-tab="${state.tab}"]`).focus();return;}
 if(b.dataset.source){state.source=b.dataset.source;draw();app.querySelector(`[data-source="${state.source}"]`).focus();return;}
 if(b.dataset.pin){const text=b.dataset.pin;state.pins=state.pins.includes(text)?state.pins.filter(t=>t!==text):[...state.pins,text];draw();const bs=[...app.querySelectorAll('[data-pin]')];bs.find(x=>x.dataset.pin===text)?.focus({preventScroll:true});toast(state.pins.includes(text)?'근거로 보관했습니다. 판단은 직접 정해 주세요.':'근거 보관을 해제했습니다.');return;}
 if(b.dataset.reason){state.reason=b.dataset.reason;state.feedback='';draw();app.querySelector(`[data-reason="${state.reason}"]`).focus();return;}
 switch(b.dataset.action){case 'move':invalidate();if(state.movers.includes(state.selected)){state.movers=state.movers.filter(id=>id!==state.selected);if(state.head===state.selected)state.head='';}else state.movers.push(state.selected);draw();app.querySelector('.board').scrollTop=scroll;app.querySelector('[data-action="move"]').focus({preventScroll:true});break;
 case 'head':state.head=state.selected;invalidate();draw();app.querySelector('.board').scrollTop=scroll;app.querySelector('[data-action="head"]').focus({preventScroll:true});break;
 case 'review':state.tab='review';draw();app.querySelector('.review h2').setAttribute('tabindex','-1');app.querySelector('.review h2').focus();break;
 case 'back':state.tab='graph';draw();app.querySelector('[data-tab="graph"]').focus();break;
 case 'source':state.tab='source';state.source='story';draw();app.querySelector('[data-tab="source"]').focus();break;
 case 'submit':submit();break;
 case 'help':state.help=true;draw();app.querySelector('[data-action="close-help"]').focus();break;
 case 'close-help':state.help=false;draw();app.querySelector('[data-action="help"]').focus();break;}
});
app.addEventListener('change',e=>{if(e.target.id==='relation'){state.relation=e.target.value;state.reason='';state.feedback='';state.complete=false;const scroll=app.querySelector('.board').scrollTop;draw();app.querySelector('.board').scrollTop=scroll;app.querySelector('#relation').focus({preventScroll:true});}});
app.addEventListener('keydown',e=>{if(state.help){if(e.key==='Escape'){state.help=false;draw();app.querySelector('[data-action="help"]').focus();}if(e.key==='Tab'){e.preventDefault();app.querySelector('[data-action="close-help"]').focus();}}else if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['source','graph','review'];state.tab=e.key==='Home'?'source':e.key==='End'?'review':tabs[(tabs.indexOf(state.tab)+(e.key==='ArrowRight'?1:2))%3];draw();app.querySelector(`[data-tab="${state.tab}"]`).focus();}});
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{[width,height]=b.dataset.size.split(',').map(Number);document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));state.before=false;document.getElementById('compare').textContent='현재 화면';draw();}));
document.getElementById('compare').onclick=()=>{state.before=!state.before;document.getElementById('compare').textContent=state.before?'새 시안':'현재 화면';draw();};
document.getElementById('reset').onclick=()=>{Object.assign(state,{tab:'graph',source:'story',selected:'ga',movers:[],head:'',relation:'',reason:'',pins:[],feedback:'',complete:false,help:false,before:false});document.getElementById('compare').textContent='현재 화면';draw();};
document.getElementById('device').onclick=()=>{width=Math.max(280,Math.min(1180,window.innerWidth));height=window.innerHeight;state.before=false;document.querySelector('.studio').style.display='none';document.querySelector('.stage').style.padding='0';draw();};
window.addEventListener('resize',()=>{document.getElementById('measure').textContent=`표시 ${Math.round(app.getBoundingClientRect().width)} × ${height}px | 맑은 고딕 16px | PC 기록:자료 58:42 | 제안 수치`;});draw();
</script>
</body></html>
