<symbol id="avatar-chae" viewBox="0 0 64 64"><rect width="64" height="64" fill="#dde2df"/><path d="M6 64Q10 43 32 43Q55 44 58 64" fill="#697a88"/><path d="M15 35Q8 9 31 5Q54 7 48 36" fill="#66666b"/><path d="M25 39h14v13H25" fill="#c8a28d"/><path d="M18 23Q18 12 32 12Q47 11 46 27l-4 9Q38 43 31 43Q21 41 20 32" fill="#dfbda7"/><path d="M14 24Q16 4 32 6Q52 6 48 26l-7-12Q30 24 18 21" fill="#66666b"/><path d="M24 29h5m7 0h5" stroke="#41545d" stroke-width="2"/><path d="M29 37h6" stroke="#9f786c"/><path d="M21 48l11 9 10-9 7 16H15" fill="#a6b7bf"/></symbol>
</defs></svg>
<header class="studio"><div><strong>주민센터 · 두 업무 연결 시안</strong><br><small>계획 검토용 · 전입은 기존 화면 · 복지는 임시 조작 · 저장·판정 미연결</small></div><div class="tools"><button data-size="390,844">390 × 844</button><button data-size="320,568">320 × 568</button><button data-size="430,932">430 × 932</button><button data-size="1180,820">PC</button><button data-route="hub">업무 선택</button><button id="gate">첫 근무 완료로 보기</button><button id="reset">시안 초기화</button></div><div id="measure" class="measure"></div></header>
<main class="stage"><section id="app" class="frame" aria-label="두 업무 연결 시안"></section></main>
<script>
const $=id=>document.getElementById(id),app=$('app');let width=390,height=844;
const state={route:'hub',unlocked:false,tab:'source',source:'S01',selected:'elder',pins:[],answers:[],claims:{},issue:'',service:'',followup:'',list:false,modal:false};
const names={elder:'박정임',daughter:'김하나',neighbor:'오민수'},avatars={elder:'chae',daughter:'bo',neighbor:'ga'};
const portrait=id=>`<svg class="portrait" aria-hidden="true"><use href="#avatar-${avatars[id]||id}"/></svg>`;
const sources={
 S01:{title:'이웃이 남긴 도움 요청',author:'오민수 · 이웃',date:'오늘 · 도움 요청 접수',lines:['요즘 정임 어르신이 식사를 거르는 날이 보여 걱정됩니다.','정확히 어떤 사정인지는 어르신께 확인해 주시면 좋겠어요.']},
 S02:{title:'이전 상담 기록',author:'주민센터 · 상담 기록',date:'3개월 전 · 당시 생활 상황',lines:['박정임과 딸 김하나는 당시 같은 주소에서 지내고 있었다.','최근 거주 상황과 실제 도움 방식은 이 기록에 포함되어 있지 않다.']},
 S03:{title:'정임에게 확인한 생활',author:'박정임 · 당사자 진술',date:'오늘 · 생활 상황 확인',lines:['딸은 지난달 다른 지역으로 옮겼고 지금은 혼자 지내요. 장보기와 식사 준비가 어려워요.','딸에게 확인하셔도 좋아요. 식사 지원 상담도 연결해 주세요.']},
 S04:{title:'하나가 말하는 도움의 범위',author:'김하나 · 딸의 답변',date:'오늘 · 당사자 동의 후 확인',lines:['저는 다른 지역에 있어 매일 방문하기는 어려워요.','저녁마다 전화로 연락하고 있어요. 방문 도움이 필요하면 따로 상의해야 해요.']},
 S05:{title:'모퉁이복지관 안내',author:'모퉁이복지관 · 가상 기관',date:'현재 · 식사 지원 상담 안내',lines:['주민이 원하는 경우 식사 지원 상담을 접수할 수 있습니다.','서비스 제공 여부와 일정은 상담 후 기관에서 확인합니다.']}
};
const planLabels={meal:'식사 준비의 어려움',housing:'주거 문제',unknown:'추가 확인 필요','meal-consult':'모퉁이복지관 · 식사 지원 상담','daily-family':'가족에게 매일 방문 요청',check:'추가 상담 내용 확인','next-shift':'담당 직원 · 다음 근무일 접수 여부 확인',none:'후속 확인 없이 종료'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function select(id,value,items,label){return `<select id="${id}" aria-label="${label}"><option value="">직접 선택해 주세요</option>${items.map(([v,t])=>`<option value="${v}" ${value===v?'selected':''}>${t}</option>`).join('')}</select>`;}
function render(){
 app.className='frame'+(width>=800?' desktop':'')+(height<650?' compact':'');app.style.width=width+'px';app.style.height=height+'px';
 $('measure').textContent=`실제 표시 ${Math.round(app.getBoundingClientRect().width)} × ${height}px · 맑은 고딕 기본 16px · PC 관계:자료 58:42 · 제안 수치`;
 $('gate').textContent=state.unlocked?'첫 근무 전으로 보기':'첫 근무 완료로 보기';
 if(state.route==='hub'){app.innerHTML=`<header class="apphead"><div class="brand">모퉁이동 주민센터</div><span class="time">DAY ${state.unlocked?'02':'01'}</span></header><section class="hub-panel"><div class="eyebrow">오늘의 근무</div><h1 class="hub-title">주소를 기록하고,<br>사람의 이야기를 잇다.</h1><div class="welcome">${portrait('chae')}<p>정서린 · 함께 일하는 선배<br>${state.unlocked?'오늘은 상담실에서도 주민을 만나볼까요?':'첫 근무는 전입창구에서 시작해요.'}</p></div><div class="desk-grid"><article class="desk-card"><span class="index">01 / 전입 업무</span><h2>전입창구</h2><p>누가 이사하고, 누가 남을까요?<br>주민의 새 주소 기록을 완성하세요.</p><div class="progressline"><i style="width:${state.unlocked?'25%':'0%'}"></i></div><p>${state.unlocked?'첫 근무 완료 · 다음 접수 대기':'첫 접수부터 배우기'}</p><button data-route="movein">${state.unlocked?'전입창구 이어하기':'전입창구 시작'}</button></article><article class="desk-card welfare"><span class="index">02 / 복지 업무</span><h2>복지상담실</h2><p>말과 기록 사이의 빈틈을 살펴보고<br>필요한 도움으로 연결하세요.</p><button data-route="welfare" ${state.unlocked?'':'disabled'}>${state.unlocked?'첫 상담 시작 →':'첫 전입 근무 후 열립니다'}</button><div class="locknote">${state.unlocked?'W01 · 같은 주소, 다른 하루':'전입 첫 근무를 마치면 상담을 맡게 됩니다.'}</div></article></div><p class="hub-foot">각 업무에서 작성한 초안은 이어서 할 수 있습니다.<br>자료를 읽고 판단하는 속도에 맞춰 진행하세요.</p></section><footer class="footer"><span class="status">상담실이 궁금하다면</span><button class="primary" data-action="preview">상담 체험</button></footer>`;return;}
 if(state.route==='movein'){app.innerHTML=`<header class="apphead"><button class="help" data-route="hub">← 업무 선택</button><span>전입창구 · 현재 구현</span></header><section class="current-wrap"><img src="../docs/검증화면/첫접수/관계_390.png" alt="기존 전입창구 화면"></section><footer class="footer"><span class="status">이 시안에서는 현재 화면 비교입니다.</span><button class="primary" data-route="hub">업무 선택으로</button></footer>`;return;}
 app.innerHTML=`<header class="apphead"><button class="help" data-route="hub">← 업무 선택</button><div class="brand">복지상담실</div><span class="time">W01</span></header><section class="casebar"><div><div class="eyebrow">첫 상담 · ${state.unlocked?'정식 근무':'상담 체험'}</div><h1>같은 주소, 다른 하루</h1><p>지금 어떤 도움이 필요한지 확인해 주세요.</p></div></section><nav class="tabs" role="tablist" aria-label="상담 작업">${[['source','자료'],['relation','관계'],['plan','계획']].map(([id,t],i)=>`<button role="tab" aria-selected="${state.tab===id}" aria-controls="${id}-panel" data-tab="${id}"><span>0${i+1}</span>${t}</button>`).join('')}</nav><div class="workspace">${relation()}${plan()}${source()}</div><footer class="footer"><span class="status"><strong>내 판단 · 작성 중</strong>근거 보관 ${state.pins.length}개</span><button class="primary" data-action="${state.tab==='plan'?'review':'plan'}">${state.tab==='plan'?'계획 검토 →':'연결 계획 →'}</button></footer>${state.modal?modal():''}`;
}
function source(){const s=sources[state.source];return `<section class="panel source ${state.tab!=='source'?'hidden':''}" id="source-panel" role="tabpanel"><div class="panel-heading"><div><h2>상담 자료</h2><p>말한 사람과 시점을 함께 읽으세요.</p></div><span class="tag">자료</span></div><label class="source-choose"><span>자료 선택</span><select id="source">${Object.entries(sources).filter(([id])=>!['S03','S04'].includes(id)||state.answers.includes(id)).map(([id,d])=>`<option value="${id}" ${state.source===id?'selected':''}>${d.title}</option>`).join('')}</select></label><div class="sourcedate">${s.date}</div><h3>${s.title}</h3><div class="speaker">${portrait(state.source==='S01'?'neighbor':state.source==='S04'?'daughter':'elder')}<div>${s.author}</div></div><blockquote>${s.lines.map((line,i)=>{const id=state.source+':'+i;return `<button class="evidence ${state.pins.includes(id)?'pinned':''}" aria-pressed="${state.pins.includes(id)}" data-pin="${id}">${line}</button>`;}).join('')}</blockquote><p class="caption">판단에 사용할 문장을 눌러 보관하세요.</p><div class="questions"><button data-question="S03">${state.answers.includes('S03')?'답변 다시 보기':'당사자에게 질문'} · 요즘 어떻게 지내세요?</button><button data-question="S04" ${state.answers.includes('S03')?'':'disabled'}>${state.answers.includes('S04')?'답변 다시 보기':'딸에게 확인'} · 지금 어떤 도움을 주고 있나요?</button></div><aside class="pinlog"><strong>보관한 근거 / ${state.pins.length}</strong>${state.pins.length?state.pins.map(id=>{const [doc,i]=id.split(':');return `<p>${sources[doc].lines[+i]}</p>`;}).join(''):'<p>아직 보관한 문장이 없습니다.</p>'}</aside></section>`;}
function relation(){const vals=state.claims[state.selected]||{};return `<section class="panel board ${state.tab!=='relation'&&!(width>=800&&state.tab==='source')?'hidden':''}" id="relation-panel" role="tabpanel"><div class="panel-heading"><div><h2>사람과 생활의 연결</h2><p>인물을 선택하고 확인한 관계를 적으세요.</p></div><span class="tag">내 판단</span></div><div class="legend"><span><i></i>확인한 사실</span><span><i class="draft"></i>아직 판단할 관계</span></div>${state.list?`<div class="personlist">${Object.keys(names).map(id=>`<button data-person="${id}" aria-pressed="${state.selected===id}">${portrait(id)}<b>${names[id]}</b></button>`).join('')}</div>`:`<div class="peoplemap"><svg class="lines" viewBox="0 0 350 254" preserveAspectRatio="none" aria-hidden="true"><path d="M175 102V128H87V148 M175 128H263V148"/></svg>${Object.keys(names).map(id=>`<button class="node ${id} ${state.selected===id?'selected':''}" data-person="${id}" aria-pressed="${state.selected===id}">${portrait(id)}<b>${names[id]}</b></button>`).join('')}<div class="node-label">현재의 관계는 직접 확인하세요</div></div>`}<section class="claim-editor"><h3>${names[state.selected]} · 내 판단</h3><label for="claim">${state.selected==='elder'?'현재 함께 사는 사람은?':'정임과 어떤 관계인가요?'}</label>${select('claim',vals.value||'',state.selected==='elder'?[['alone','현재 혼자 거주'],['together','현재 가족과 거주'],['unknown','추가 확인 필요']]:[['family','가족'],['neighbor','이웃'],['unknown','추가 확인 필요']],'관계 판단')}<label for="proof">이 판단의 근거</label>${select('proof',vals.proof||'',state.pins.map(id=>{const [doc,i]=id.split(':');return[id,sources[doc].lines[+i]];}),'판단 근거')}<div class="proof">${vals.proof?'선택한 원문과 내 판단을 검토할 수 있습니다.':'자료에서 문장을 보관한 뒤 연결하세요.'}</div><p>자료를 읽어도 내 판단은 자동으로 채워지지 않습니다.</p></section><div class="listmode"><button data-action="list">${state.list?'관계망으로 보기':'인물 목록으로 보기'}</button></div></section>`;}
function plan(){return `<section class="panel planform ${state.tab!=='plan'?'hidden':''}" id="plan-panel" role="tabpanel"><div class="panel-heading"><div><h2>다음 행동을 정하세요</h2><p>확인한 상황을 구체적인 요청으로 연결하세요.</p></div></div><div class="paper"><span class="stamp">상담 연결 초안</span><div class="planline">상담 대상 · 박정임<br>근거 보관 · ${state.pins.length}개</div><label for="issue">어떤 생활 문제를 확인했나요?</label>${select('issue',state.issue,[['meal','식사 준비의 어려움'],['housing','주거 문제'],['unknown','추가 확인 필요']],'생활 문제')}<label for="service">어디에 어떤 요청을 할까요?</label>${select('service',state.service,[['meal-consult','모퉁이복지관 · 식사 지원 상담'],['daily-family','가족에게 매일 방문 요청'],['check','추가 상담 내용 확인']],'연결 요청')}<label for="followup">다음 확인은 어떻게 할까요?</label>${select('followup',state.followup,[['next-shift','담당 직원 · 다음 근무일 접수 여부 확인'],['none','후속 확인 없이 종료']],'후속 확인')}<p>지원 상담 접수와 실제 서비스 제공은 다른 단계입니다.</p></div></section>`;}
function modal(){return `<div class="modal-scrim"><section class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">내 연결 계획</h2><p>생활 문제: ${esc(planLabels[state.issue]||'미정')}<br>연결 요청: ${esc(planLabels[state.service]||'미정')}<br>후속 확인: ${esc(planLabels[state.followup]||'미정')}</p><p>이 화면은 계획 검토용 시안입니다. 실제 근거 판정과 저장은 후속 구현에서 연결합니다.</p><button data-action="close">수정하러 돌아가기</button></section></div>`;}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.route){state.route=b.dataset.route;render();return;}if(b.dataset.tab){state.tab=b.dataset.tab;render();app.querySelector(`[data-tab="${state.tab}"]`).focus();return;}if(b.dataset.person){state.selected=b.dataset.person;render();app.querySelector('.claim-editor').scrollIntoView({block:'nearest',behavior:'instant'});app.querySelector('#claim').focus({preventScroll:true});return;}if(b.dataset.pin){const id=b.dataset.pin;state.pins=state.pins.includes(id)?state.pins.filter(x=>x!==id):[...state.pins,id];for(const v of Object.values(state.claims))if(v.proof&&!state.pins.includes(v.proof))v.proof='';render();app.querySelector(`[data-pin="${id}"]`)?.focus({preventScroll:true});return;}if(b.dataset.question){const id=b.dataset.question;if(!state.answers.includes(id))state.answers.push(id);state.source=id;render();app.querySelector('#source').focus();return;}switch(b.dataset.action){case'preview':state.route='welfare';render();break;case'plan':state.tab='plan';render();break;case'list':state.list=!state.list;render();break;case'review':state.modal=true;render();app.querySelector('[data-action=close]').focus();break;case'close':state.modal=false;render();app.querySelector('[data-action=review]').focus();break;}});
app.addEventListener('change',e=>{const id=e.target.id;if(id==='source')state.source=e.target.value;else if(['claim','proof'].includes(id)){state.claims[state.selected]=state.claims[state.selected]||{};state.claims[state.selected][id==='claim'?'value':'proof']=e.target.value;}else if(['issue','service','followup'].includes(id))state[id]=e.target.value;render();app.querySelector('#'+id)?.focus({preventScroll:true});});
app.addEventListener('keydown',e=>{if(state.modal&&e.key==='Escape'){state.modal=false;render();app.querySelector('[data-action=review]').focus();}else if(state.modal&&e.key==='Tab'){e.preventDefault();app.querySelector('[data-action=close]').focus();}else if(e.target.matches('[role=tab]')&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();const tabs=['source','relation','plan'];state.tab=tabs[(tabs.indexOf(state.tab)+(e.key==='ArrowRight'?1:2))%3];render();app.querySelector(`[data-tab="${state.tab}"]`).focus();}});
document.querySelectorAll('.studio [data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;render();});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{[width,height]=b.dataset.size.split(',').map(Number);render();});
$('gate').onclick=()=>{state.unlocked=!state.unlocked;render();};$('reset').onclick=()=>location.reload();window.addEventListener('resize',()=>render());render();
</script></body></html>
