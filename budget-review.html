<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예산 퍼즐 화면 검토</title><style>body{font:15px system-ui;background:#eee9d4;color:#283a27;margin:20px}button{min-height:44px;padding:8px 16px;font:inherit}section{display:flex;gap:16px;flex-wrap:wrap}figure{margin:8px 0;width:340px}img{width:100%;height:auto}iframe{display:block;border:2px solid #4e6545;height:850px;background:#fff;max-width:100%}#measure{padding:10px;background:#fffdf4}h2{font-size:18px}</style><h1>예산 퍼즐 화면 검토</h1><p>실제 앱을 같은 폰트로 조작합니다. 연습실 → 부서의 정산표 / 머리 퍼즐의 예산표 → 중·상16~18번을 선택하세요.</p><div><button onclick="size(320)">320px</button> <button onclick="size(375)">375px</button> <button onclick="size(800)">800px</button></div><p id="measure"></p><iframe id="app" title="실제 게임 미리보기" src="index.html" width="375"></iframe><h2>정산표: 계획 당시 하 / 구현한 중</h2><section><figure><figcaption>계획 당시 하 (6469b2b)</figcaption><img src="test-results/current-sumgrid.jpg"></figure><figure><figcaption>구현 후 중</figcaption><img src="test-results/it-normal.png"></figure></section><h2>예산표: 계획 당시 하 / 구현한 상</h2><section><figure><figcaption>계획 당시 하 (6469b2b)</figcaption><img src="test-results/current-queens.jpg"></figure><figure><figcaption>구현 후 상</figcaption><img src="test-results/budget-hard.png"></figure></section><script>const frame=document.getElementById('app');function size(w){frame.width=w;measure();}function measure(){let text='화면 너비 '+frame.contentWindow.innerWidth+'px (외곽 '+frame.getBoundingClientRect().width+'px)';try{const d=frame.contentDocument,cell=d.querySelector('.bp-cell'),grid=d.querySelector('.bp-grid');if(cell){const r=cell.getBoundingClientRect();text+=' · 칸 '+r.width.toFixed(1)+'×'+r.height.toFixed(1)+'px · 글자 '+frame.contentWindow.getComputedStyle(cell).fontSize+' · 판 너비 '+grid.getBoundingClientRect().width.toFixed(1)+'px';}text+=' · 가로 넘침 '+Math.max(0,d.documentElement.scrollWidth-frame.contentWindow.innerWidth)+'px';}catch{}document.getElementById('measure').textContent=text;}setInterval(measure,750);</script></html>
